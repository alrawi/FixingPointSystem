# Pairs with the first party http1 module in modules/http1, which the agent runs. The scenario http1/single_fetch belongs to that module. The example http1 module of contracts/examples/modules/ has other scenarios (see http_smoke.yaml).
apiVersion: fixingpoint.dev/v1alpha1
kind: Test
metadata:
  name: http1_first_party
  description: One HTTP/1.1 GET on its own connection, from the first party http1 module.
topology: app_sim
network:
  ports:
    - { name: client0, location: local/lo }
    - { name: server0, location: local/lo }
  host_pools:
    - { name: clients, port: client0, role: client, ipv4: 16.0.0.0/24, count: 254 }
    - { name: servers, port: server0, role: server, ipv4: 48.0.0.0/24, count: 1 }
profile:
  basis: sessions
  mix:
    - { scenario: http1/single_fetch, weight: 1 }
load:
  objective: { type: sessions_per_second, value: 500 }
  phases:
    - { name: steady, duration_s: 20, shape: hold }
timeline: { seed: 5 }
criteria:
  - { metric: sessions.failed_ratio, op: "==", value: 0 }
