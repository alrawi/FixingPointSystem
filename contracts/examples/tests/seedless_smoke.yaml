apiVersion: fixingpoint.dev/v1alpha1
kind: Test
metadata:
  name: seedless_smoke
  description: DNS lookups without a seed, so the controller chooses a random nonzero seed and records it in the run.
topology: app_sim
network:
  ports:
    - { name: client0, location: local/lo }
    - { name: server0, location: local/lo }
  host_pools:
    - { name: clients, port: client0, role: client, ipv4: 16.0.0.0/24, count: 254 }
    - { name: servers, port: server0, role: server, ipv4: 48.0.0.0/24, count: 1 }
profile:
  basis: sessions
  mix:
    - { scenario: dns/lookup, weight: 1 }
load:
  objective: { type: sessions_per_second, value: 500 }
  phases:
    - { name: steady, duration_s: 20, shape: hold }
timeline: { warmup_s: 5 }
criteria:
  - { metric: sessions.failed_ratio, op: "==", value: 0 }
