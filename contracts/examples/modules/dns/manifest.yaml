apiVersion: fixingpoint.dev/v1alpha1
kind: Module
name: dns
version: 0.1.0
type: app
summary: DNS lookups over UDP.
engine_api: ">=0.2, <0.3"
license: GPL-3.0-only
provides:
  - { protocol: dns, transport: udp, port: 53 }
parameters:
  type: object
  properties:
    server_port: { type: integer, default: 53 }
settings:
  type: object
  additionalProperties: false
  properties:
    zone_file:
      type: string
      minLength: 1
      description: Zone file in RFC 1035 master file format that the server answers from. Without it the server answers every query with the address that the scenario gives.
functions:
  - name: query
    summary: Query message in RFC 1035 wire format with a transaction id from the session generator.
    params:
      - { name: name, type: text }
      - { name: qtype, type: text, default: A }
  - name: answer_ip
    summary: First address in the answer section of a response, as text.
    params:
      - { name: message, type: bytes }
  - name: response
    summary: Response to a query message that answers its first question with one address.
    params:
      - { name: query, type: bytes }
      - { name: address, type: text }
      - { name: ttl, type: int, default: 300 }
scenarios:
  - scenarios/lookup.yaml
  - scenarios/resolve.yaml
expected_bytes:
  lookup: 84
  resolve: 84
provenance:
  source: specification
  notes: Messages follow RFC 1035. The lookup scenario sends one fixed query for www.example.test, and the resolve scenario builds its messages with the module functions.
