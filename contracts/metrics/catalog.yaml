# SPDX-License-Identifier: GPL-3.0-only
# Metric catalog, contract v0.8. Every metric that the agent records, the
# controller derives, the API serves, or a test criterion names appears here
# once. contracts/metrics/catalog.schema.json defines the format, and
# tools/contracts/validate.py checks every metric reference against this file.
catalog: fps-metrics
version: 0.8.0

# A reference to a histogram, in a test criterion or a report, appends one of
# these statistic suffixes to the histogram name, for example
# sessions.response_time.p99. The list is fixed by decision D12 item 15.
histogram_statistics: [p50, p90, p99, p999, min, max, mean, count]

labels:
  application:
    description: >-
      Module name of the application, for example http1, or the value all for
      a total over every application of the run. A metric that documents the
      value all reports it next to the per application series, and no module
      may be named all.
  scenario:
    description: >-
      Scenario name within the module, for example web_get. The session structure
      check of the realism pipeline uses it for the name of the scenario whose
      instances it rebuilt from the capture.
  flow:
    description: Flow id within the scenario.
  action_index:
    description: Zero based index of the action in the flow program, counted in document order through loop and branch bodies.
  action_type:
    description: Action type of the flow program.
    values: [connect, accept, send, expect, delay, set, loop, branch, spawn, close, raw]
  side:
    description: >-
      Side of the session that recorded the value, or of the flow program that
      ran the action. A total over both sides counts each session twice, so the
      API views and test criteria report the client side unless a criterion
      selects the server side. The metric realism.transport_deviations uses it
      for the sender of the handshake packet: client for a SYN, server for a
      SYN-ACK.
    values: [client, server]
  reason:
    description: >-
      Failure reason of a session. datagram_rejected means a received UDP
      datagram broke the size limit or stop rule of its expect, template_error
      means a template failed to render, and extension_error means a module
      function failed.
    values:
      - connect_timeout
      - connect_refused
      - expect_timeout
      - pattern_mismatch
      - unexpected_reset
      - peer_closed
      - tls_failure
      - aborted
      - internal
      - datagram_rejected
      - template_error
      - extension_error
  classifier:
    description: Independent classifier of the realism pipeline.
    values: [ndpi, zeek]
  source:
    description: >-
      Where the value of a mix metric was measured. metrics means the counters
      of the run, as the controller reports them, and classifier means the
      sessions of the capture as the classifier named by the classifier label
      labels them. A series without this label is a run metrics series, as
      every series was before this label existed.
    values: [metrics, classifier]
  property:
    description: >-
      Distribution that the realism pipeline compares with the target model.
      request_bytes holds the payload sizes of the client to server direction,
      response_bytes those of the server to client direction, and both the
      payload sizes of the two directions pooled. The values ttl, df, mss,
      window_scale, sack, timestamps, options, and syn_window name the field of
      a TCP SYN or SYN-ACK that the transport behavior check compares with the
      operating system profile of the sending host, and only
      realism.transport_deviations uses them. The values packet_gap,
      request_gap, and response_gap hold the gaps in seconds between
      consecutive packets with payload inside one stream of a session, where a
      stream is one direction of one session. request_gap holds the gaps of the
      client to server streams, response_gap those of the server to client
      streams, and packet_gap the streams of both directions pooled. Only
      realism.ks_statistic and realism.ks_p_value use them.
    values:
      - session_bytes
      - request_bytes
      - response_bytes
      - inter_arrival
      - session_duration
      - both
      - ttl
      - df
      - mss
      - window_scale
      - sack
      - timestamps
      - options
      - syn_window
      - packet_gap
      - request_gap
      - response_gap
  check:
    description: >-
      Check kind of the realism report, as the check field of an entry of its
      checks array names it.
    values:
      - conformance
      - parser_errors
      - encryption
      - content
      - session_structure
      - temporal
      - mix_accuracy
      - transport_behavior
      - messages
      - host_identity
  parser:
    description: Reference parser of the parser error check of the realism pipeline.
    values: [tshark, zeek, stub]
  alert:
    description: TLS alert description name in lower snake case, for example handshake_failure.
  port:
    description: Test port name from the test configuration.
  host_pool:
    description: Host pool name from the test configuration.

metrics:
  # --- application level -----------------------------------------------------
  - name: mix.share_pct
    type: gauge
    unit: percent
    level: application
    view: application
    labels: [application, source, classifier]
    description: >-
      Achieved share of the application in the mix, by sessions or by bytes according to profile.basis.
      The label source says which measurement it is, and classifier names the classifier of a classifier series.
  - name: mix.abs_error_pp
    type: gauge
    unit: percentage_points
    level: application
    view: application
    labels: [application, source, classifier]
    description: Absolute difference between the achieved share and the configured weight of the application.
  - name: mix.max_abs_error_pp
    type: gauge
    unit: percentage_points
    level: application
    view: application
    labels: [source, classifier]
    description: Largest mix.abs_error_pp over all applications of the run.
  - name: realism.conformance_ratio
    type: gauge
    unit: ratio
    level: application
    view: realism
    labels: [application, classifier]
    description: Fraction of sampled sessions of the application that the classifier labels as the intended application.
  - name: realism.ks_statistic
    type: gauge
    unit: ratio
    level: application
    view: realism
    labels: [application, property]
    description: Kolmogorov Smirnov statistic between the observed distribution and the target model. The application value all compares the sessions of every application together.
  - name: realism.ks_p_value
    type: gauge
    unit: ratio
    level: application
    view: realism
    labels: [application, property]
    description: p value of the Kolmogorov Smirnov test for the same comparison as realism.ks_statistic, with the same application values and properties.

  # --- scenario level --------------------------------------------------------
  # The application view of the API also serves these metrics, summed over the
  # scenario label. Flow action metrics belong to the scenario view.
  - name: sessions.attempted
    type: counter
    unit: sessions
    level: scenario
    view: scenario
    labels: [application, scenario, side]
    description: Sessions that the engine started.
  - name: sessions.established
    type: counter
    unit: sessions
    level: scenario
    view: scenario
    labels: [application, scenario, side]
    description: Sessions whose first connect or accept action completed.
  - name: sessions.succeeded
    type: counter
    unit: sessions
    level: scenario
    view: scenario
    labels: [application, scenario, side]
    description: Sessions whose flow programs finished every action on both sides.
  - name: sessions.failed
    type: counter
    unit: sessions
    level: scenario
    view: scenario
    labels: [application, scenario, side, reason]
    description: Sessions that ended with a failed or timed out action, by failure reason.
  - name: sessions.failed_ratio
    type: gauge
    unit: ratio
    level: scenario
    view: scenario
    labels: [application, scenario, side]
    formula: sessions.failed / sessions.attempted
    description: Fraction of attempted sessions that failed. Test criteria use it without labels for the whole run.
  - name: sessions.concurrent
    type: gauge
    unit: sessions
    level: scenario
    view: scenario
    labels: [application, scenario, side]
    description: Sessions open at the sample instant.
  - name: sessions.rate
    type: gauge
    unit: sessions_per_second
    level: scenario
    view: scenario
    labels: [application, scenario, side]
    description: Sessions attempted per second over the last sample interval.
  - name: sessions.response_time
    type: histogram
    unit: us
    level: scenario
    view: scenario
    labels: [application, scenario, side]
    description: Time from the first send of a transaction to the end of its matching expect.
  - name: sessions.duration
    type: histogram
    unit: us
    level: scenario
    view: scenario
    labels: [application, scenario, side]
    description: Time from session start to the end of its last action.
  - name: transactions.attempted
    type: counter
    unit: transactions
    level: scenario
    view: scenario
    labels: [application, scenario, side]
    description: Transactions started, where a transaction is one send followed by its matching expect.
  - name: transactions.succeeded
    type: counter
    unit: transactions
    level: scenario
    view: scenario
    labels: [application, scenario, side]
    description: Transactions whose expect finished before its timeout.
  - name: bytes.tx
    type: counter
    unit: bytes
    level: scenario
    view: scenario
    labels: [application, scenario, side]
    description: Application payload bytes that the side sent, excluding transport headers.
  - name: bytes.rx
    type: counter
    unit: bytes
    level: scenario
    view: scenario
    labels: [application, scenario, side]
    description: Application payload bytes that the side received, excluding transport headers.
  - name: throughput.bps
    type: gauge
    unit: bits_per_second
    level: scenario
    view: scenario
    labels: [application, scenario, side]
    description: Application payload throughput in both directions over the last sample interval.

  # --- flow action level -----------------------------------------------------
  - name: actions.expect_timeouts
    type: counter
    unit: events
    level: flow_action
    view: scenario
    labels: [application, scenario, flow, side, action_index]
    description: Expect actions that did not finish within their timeout.
  - name: actions.pattern_mismatches
    type: counter
    unit: events
    level: flow_action
    view: scenario
    labels: [application, scenario, flow, side, action_index]
    description: Expect actions that received data that cannot match the pattern.
  - name: actions.unexpected_resets
    type: counter
    unit: events
    level: flow_action
    view: scenario
    labels: [application, scenario, flow, side, action_index]
    description: Resets from the peer while the action ran and the flow program did not expect a close.
  - name: actions.latency
    type: histogram
    unit: us
    level: flow_action
    view: scenario
    labels: [application, scenario, flow, side, action_index, action_type]
    description: Time from the start to the end of one action.

  # --- transport level -------------------------------------------------------
  - name: tcp.handshakes
    type: counter
    unit: events
    level: transport
    view: tcp
    labels: [port, side]
    description: TCP three way handshakes that completed.
  - name: tcp.handshake_failures
    type: counter
    unit: events
    level: transport
    view: tcp
    labels: [port, side]
    description: TCP handshakes that timed out or met a reset.
  - name: tcp.retransmissions
    type: counter
    unit: packets
    level: transport
    view: tcp
    labels: [port, side]
    description: TCP segments that the engine retransmitted.
  - name: tcp.resets.tx
    type: counter
    unit: packets
    level: transport
    view: tcp
    labels: [port, side]
    description: TCP segments with RST that the engine sent.
  - name: tcp.resets.rx
    type: counter
    unit: packets
    level: transport
    view: tcp
    labels: [port, side]
    description: TCP segments with RST that the engine received.
  - name: tcp.zero_window_events
    type: counter
    unit: events
    level: transport
    view: tcp
    labels: [port, side]
    description: Times a peer advertised a zero receive window.
  - name: tcp.rtt
    type: histogram
    unit: us
    level: transport
    view: tcp
    labels: [port, side]
    description: Smoothed round trip time samples of TCP sessions.
  - name: tls.handshakes
    type: counter
    unit: events
    level: transport
    view: tls
    labels: [port, side]
    description: TLS handshakes that completed.
  - name: tls.handshake_failures
    type: counter
    unit: events
    level: transport
    view: tls
    labels: [port, side]
    description: TLS handshakes that failed or timed out.
  - name: tls.alerts.tx
    type: counter
    unit: events
    level: transport
    view: tls
    labels: [port, side, alert]
    description: TLS alerts that the engine sent, by alert type.
  - name: tls.alerts.rx
    type: counter
    unit: events
    level: transport
    view: tls
    labels: [port, side, alert]
    description: TLS alerts that the engine received, by alert type.
  - name: tls.resumptions
    type: counter
    unit: events
    level: transport
    view: tls
    labels: [port, side]
    description: TLS handshakes that resumed an earlier session.
  - name: tls.resumption_ratio
    type: gauge
    unit: ratio
    level: transport
    view: tls
    labels: [port, side]
    formula: tls.resumptions / tls.handshakes
    description: Fraction of completed TLS handshakes that resumed an earlier session.
  - name: tls.handshake_time
    type: histogram
    unit: us
    level: transport
    view: tls
    labels: [port, side]
    description: Time from ClientHello to the Finished message of a completed TLS handshake.

  # --- port and host level ---------------------------------------------------
  - name: port.packets.tx
    type: counter
    unit: packets
    level: port_host
    view: port
    labels: [port]
    description: Packets that the port sent.
  - name: port.packets.rx
    type: counter
    unit: packets
    level: port_host
    view: port
    labels: [port]
    description: Packets that the port received.
  - name: port.bytes.tx
    type: counter
    unit: bytes
    level: port_host
    view: port
    labels: [port]
    description: Bytes that the port sent, including all headers.
  - name: port.bytes.rx
    type: counter
    unit: bytes
    level: port_host
    view: port
    labels: [port]
    description: Bytes that the port received, including all headers.
  - name: port.drops
    type: counter
    unit: packets
    level: port_host
    view: port
    labels: [port]
    description: Packets that the backend dropped on the port, for example on a full ring.
  - name: port.throughput.tx_bps
    type: gauge
    unit: bits_per_second
    level: port_host
    view: port
    labels: [port]
    description: Line rate that the port sent over the last sample interval.
  - name: port.throughput.rx_bps
    type: gauge
    unit: bits_per_second
    level: port_host
    view: port
    labels: [port]
    description: Line rate that the port received over the last sample interval.
  - name: host.arp_failures
    type: counter
    unit: events
    level: port_host
    view: port
    labels: [port, host_pool]
    description: ARP resolutions that did not receive a reply.
  - name: host.nd_failures
    type: counter
    unit: events
    level: port_host
    view: port
    labels: [port, host_pool]
    description: IPv6 neighbor discovery resolutions that did not receive a reply.
  - name: host.active
    type: gauge
    unit: hosts
    level: port_host
    view: port
    labels: [port, host_pool]
    description: Emulated hosts that hold at least one open session.

  # --- realism check metrics (CON-23) ----------------------------------------
  # Every check kind of the realism report carries realism.check_failures, and
  # most carry a metric of their own. The metrics sit at the end of the file so
  # that the position of every earlier metric, which the engine table uses as
  # its identifier, stays as it was. contracts/changes/CON-23.md gives the
  # target and the outcome of each metric as the controller reports them.
  - name: realism.check_failures
    type: gauge
    unit: events
    level: application
    view: realism
    labels: [check]
    description: >-
      Number of reasons for which the check failed, and 0 exactly when the check passed.
      Every check of the realism report carries one series, so a failing check is visible
      even when no other metric of it exists, for example when no parser ran.
  - name: realism.parser_errors
    type: gauge
    unit: events
    level: application
    view: realism
    labels: [application, parser]
    description: >-
      Parser errors and malformed packets that the reference parser reported in the sessions
      of the application. The application value all totals every finding of the parser,
      including those in unlabelled sessions and in packets that belong to no session.
  - name: realism.decrypted_ratio
    type: gauge
    unit: ratio
    level: application
    view: realism
    labels: []
    description: Fraction of the sampled TLS sessions that decrypted with the exported keys.
  - name: realism.ja4_match_ratio
    type: gauge
    unit: ratio
    level: application
    view: realism
    labels: []
    description: Fraction of the sampled TLS sessions whose ClientHello has a JA4 fingerprint that its client profile lists.
  - name: realism.duplicate_ratio
    type: gauge
    unit: ratio
    level: application
    view: realism
    labels: [application]
    description: Fraction of the payload units of the application that repeat an earlier payload of the capture.
  - name: realism.structure_failures
    type: gauge
    unit: events
    level: application
    view: realism
    labels: [scenario]
    description: >-
      Rules that the instances of the scenario break in the capture: a flow with a number of
      connections that the scenario does not allow, a violated after or spawn edge, no session
      for any flow, or a number of instances that differs from the expected one.
  - name: realism.transport_deviations
    type: gauge
    unit: packets
    level: application
    view: realism
    labels: [property, side]
    description: >-
      TCP SYN packets (side client) or SYN-ACK packets (side server) of profiled hosts whose
      field named by property differs from the operating system profile. Only fields that the
      check enforces have a series.
