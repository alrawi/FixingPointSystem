openapi: 3.1.0
info:
  title: FixingPointSystem Controller API
  version: 0.10.0
  summary: Contract v0.2 for the controller REST API.
  description: >
    The controller stores test configurations, installs modules, starts runs on
    agents, and serves metrics and reports. Long operations return HTTP 202 with
    a run identifier. Errors use RFC 9457 problem details. Names for ports,
    devices, flows, and metrics follow Open Traffic Generator vocabulary
    (decision D5). The Prometheus exposition at GET /metrics lies outside the
    /v1 base path, and contracts/openapi/fps-metrics.yaml documents it.
  license:
    name: GPL-3.0-only
    identifier: GPL-3.0-only
servers:
  - url: https://{controller}/v1
    variables:
      controller:
        default: localhost:8443
security:
  - bearerToken: []
tags:
  - name: system
  - name: modules
  - name: configs
  - name: runs
  - name: agents
paths:
  /capabilities:
    get:
      tags: [system]
      operationId: getCapabilities
      summary: Engine API version, backends, agent inventory, and installed modules.
      x-required-scope: read
      responses:
        "200":
          description: Capabilities.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Capabilities" }
        default: { $ref: "#/components/responses/Problem" }
  /modules:
    get:
      tags: [modules]
      operationId: listModules
      x-required-scope: read
      parameters:
        - { name: type, in: query, schema: { $ref: "#/components/schemas/ModuleType" } }
        - { $ref: "#/components/parameters/PageSize" }
        - { $ref: "#/components/parameters/PageToken" }
      responses:
        "200":
          description: Installed modules.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/ModuleSummary" } }
                  next_page_token: { type: string }
        default: { $ref: "#/components/responses/Problem" }
    post:
      tags: [modules]
      operationId: installModule
      summary: Install a signed module archive.
      description: >
        Installs the module archive in the request body. A controller with a
        module trust store verifies the detached Ed25519 signature over the
        module tree digest before it unpacks the archive. The signature is not
        part of the archive, so it travels in the two optional headers. A
        request must send both headers or neither.
      x-required-scope: admin
      parameters:
        - name: X-Module-Signature-Key-Id
          in: header
          required: false
          description: >
            Id of the trust store key that made the signature, for example
            ed25519:fe812c12f3ab4ce6ac5db69ac352f906. Sent together with
            X-Module-Signature, or not at all.
          schema: { type: string, minLength: 1 }
        - name: X-Module-Signature
          in: header
          required: false
          description: >
            The 64 byte Ed25519 signature over the module tree digest, in
            standard base64 with padding. Sent together with
            X-Module-Signature-Key-Id, or not at all. A module without a
            signature installs only when the controller allows unsigned
            modules.
          schema: { type: string, format: byte }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, contentMediaType: application/octet-stream }
      responses:
        "201":
          description: Installed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModuleSummary" }
        "400":
          description: >
            Only one of the two signature headers is present, the signature is
            not standard base64, or the archive is broken.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "403":
          description: >
            The controller refused the signature, or the token scope is too low.
            A signature is refused when the archive was modified, the key is
            unknown, revoked, or expired, the key id does not match, or the
            signature is truncated, and when the module has no signature while
            the controller has a trust store and does not allow unsigned
            modules. The problem detail names the reason.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /modules/{name}/{version}:
    parameters:
      - { name: name, in: path, required: true, schema: { type: string, pattern: "^[a-z][a-z0-9_]{0,62}$" } }
      - { name: version, in: path, required: true, schema: { type: string } }
    get:
      tags: [modules]
      operationId: getModule
      x-required-scope: read
      responses:
        "200":
          description: Module manifest.
          content:
            application/json:
              schema: { $ref: "../schemas/module-manifest.schema.json" }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      tags: [modules]
      operationId: deleteModule
      x-required-scope: admin
      responses:
        "204": { description: Removed. }
        default: { $ref: "#/components/responses/Problem" }
  /configs:
    get:
      tags: [configs]
      operationId: listConfigs
      summary: List stored configurations.
      x-required-scope: read
      parameters:
        - { $ref: "#/components/parameters/PageSize" }
        - { $ref: "#/components/parameters/PageToken" }
      responses:
        "200":
          description: Stored configurations, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/ConfigRef" } }
                  next_page_token: { type: string }
        default: { $ref: "#/components/responses/Problem" }
    post:
      tags: [configs]
      operationId: createConfig
      x-required-scope: run
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "../schemas/test-config.schema.json" }
          application/yaml:
            schema: { $ref: "../schemas/test-config.schema.json" }
      responses:
        "201":
          description: Stored.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConfigRef" }
        default: { $ref: "#/components/responses/Problem" }
  /configs/{id}:
    parameters:
      - { $ref: "#/components/parameters/Id" }
    get:
      tags: [configs]
      operationId: getConfig
      x-required-scope: read
      responses:
        "200":
          description: Stored configuration.
          content:
            application/json:
              schema: { $ref: "../schemas/test-config.schema.json" }
        default: { $ref: "#/components/responses/Problem" }
  /configs/{id}:validate:
    parameters:
      - { $ref: "#/components/parameters/Id" }
    post:
      tags: [configs]
      operationId: validateConfig
      summary: Check schema, module references, and agent capacity.
      x-required-scope: run
      responses:
        "200":
          description: Validation report. `valid` is false when any finding has severity error.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationReport" }
        default: { $ref: "#/components/responses/Problem" }
  /runs:
    get:
      tags: [runs]
      operationId: listRuns
      x-required-scope: read
      parameters:
        - { name: state, in: query, schema: { $ref: "#/components/schemas/RunState" } }
        - { $ref: "#/components/parameters/PageSize" }
        - { $ref: "#/components/parameters/PageToken" }
      responses:
        "200":
          description: Runs, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Run" } }
                  next_page_token: { type: string }
        default: { $ref: "#/components/responses/Problem" }
    post:
      tags: [runs]
      operationId: startRun
      x-required-scope: run
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [config_id]
              properties:
                config_id: { type: string }
                agents: { type: array, items: { type: string }, description: Agent ids to use. The controller picks reserved agents when absent. }
                labels: { type: object, additionalProperties: { type: string } }
      responses:
        "202":
          description: Accepted. Poll the run or subscribe to its metrics stream.
          headers:
            Location: { schema: { type: string }, description: URL of the run. }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Run" }
        default: { $ref: "#/components/responses/Problem" }
  /runs/{id}:
    parameters:
      - { $ref: "#/components/parameters/Id" }
    get:
      tags: [runs]
      operationId: getRun
      x-required-scope: read
      responses:
        "200":
          description: Run state and summary counters.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Run" }
        default: { $ref: "#/components/responses/Problem" }
  /runs/{id}:stop:
    parameters:
      - { $ref: "#/components/parameters/Id" }
    post:
      tags: [runs]
      operationId: stopRun
      x-required-scope: run
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                force: { type: boolean, default: false, description: Abort immediately and skip ramp down. }
      responses:
        "202":
          description: Stopping.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Run" }
        default: { $ref: "#/components/responses/Problem" }
  /runs/{id}/metrics:
    parameters:
      - { $ref: "#/components/parameters/Id" }
    get:
      tags: [runs]
      operationId: getRunMetrics
      x-required-scope: read
      parameters:
        - { name: view, in: query, required: true, schema: { $ref: "#/components/schemas/MetricView" } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: step_s, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - name: side
          in: query
          description: Side of the sessions that the series count, client or server. Omitted, it is client, as before the parameter existed.
          schema: { type: string, enum: [client, server], default: client }
      responses:
        "200":
          description: Metric series for the view and window.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MetricSeriesSet" }
        default: { $ref: "#/components/responses/Problem" }
  /runs/{id}/metrics:stream:
    parameters:
      - { $ref: "#/components/parameters/Id" }
    get:
      tags: [runs]
      operationId: streamRunMetrics
      summary: Live metrics as Server Sent Events, one event per second per view.
      x-required-scope: read
      parameters:
        - { name: view, in: query, schema: { type: array, items: { $ref: "#/components/schemas/MetricView" } }, style: form, explode: true }
        - name: side
          in: query
          description: Side of the sessions that every requested view counts, client or server. Omitted, it is client, as before the parameter existed.
          schema: { type: string, enum: [client, server], default: client }
      description: >
        The response is a Server Sent Events stream (WHATWG HTML, event stream
        format) with these parts, in this order.

        1. The first field of the stream is `retry: <ms>`, the reconnect delay
        that the controller asks for. It equals the event period, 1000 ms by
        default.

        2. Once per event period (a tick), for each requested view in the order
        of the `view` parameters, the controller sends one event per current
        sample of that view. The event has no `event` field, so its type is
        `message`. Its `id` is the number of the tick, counted from 1 on each
        connection, so every event of one tick carries the same id. Its `data`
        is one line with a `MetricSample` as JSON.

        3. When the run is in a final state (`completed`, `failed`, or
        `aborted`), or the controller no longer knows the run, the controller
        sends the samples of that last tick and then one event named `end`. It
        has no `id`, and its `data` is a `MetricStreamEnd` as JSON. The
        controller closes the stream after it, and a client must not
        reconnect. A client that is disconnected earlier reconnects after the
        `retry` delay, reads the run with `getRun`, and stops when its state is
        final, because no `end` event follows in that case.

        The controller does not replay missed ticks. It ignores the
        `Last-Event-ID` header, and a new connection starts at tick 1 with the
        newest samples, so a client that needs the ticks of the gap reads
        `getRunMetrics`. A response carries `Cache-Control: no-store` and
        `X-Accel-Buffering: no`. A controller that serves no stream answers
        with problem details and the status 501 instead of the stream, and a
        client falls back to polling `getRunMetrics`.
      x-event-stream:
        retry: first field of the stream, in milliseconds
        events:
          - { event: message, id: "tick number, from 1 per connection", data: { $ref: "#/components/schemas/MetricSample" } }
          - { event: end, id: absent, data: { $ref: "#/components/schemas/MetricStreamEnd" } }
      responses:
        "200":
          description: >
            Event stream. Each event without an `event` field carries a
            MetricSample encoded as JSON in its data field, and the event
            `end` carries a MetricStreamEnd and closes the stream.
          headers:
            Cache-Control:
              description: Always `no-store`.
              schema: { type: string }
          content:
            text/event-stream:
              schema: { type: string }
        "501":
          description: >
            This controller does not serve the stream. The body is problem
            details, and a client polls `getRunMetrics` instead. The status is
            not retried.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /runs/{id}/report:
    parameters:
      - { $ref: "#/components/parameters/Id" }
    get:
      tags: [runs]
      operationId: getRunReport
      x-required-scope: read
      parameters:
        - { name: format, in: query, schema: { type: string, enum: [json, csv, html], default: json } }
      responses:
        "200":
          description: Report.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RunReport" }
            text/csv:
              schema: { type: string }
            text/html:
              schema: { type: string }
        default: { $ref: "#/components/responses/Problem" }
  /runs/{id}/realism:
    parameters:
      - { $ref: "#/components/parameters/Id" }
    put:
      tags: [runs]
      operationId: attachRealismReport
      x-required-scope: run
      summary: Attach the realism report of the run.
      description: >
        Delivers the realism report that the realism runner wrote for the
        capture of the run (`python3 -m realism score`), so that `realism` of
        `getRunReport` holds its results. The controller measures no realism
        itself.

        The body is the report document as the runner writes it, validated
        against `realism/schema/realism-report.schema.json`, and it is not
        rewritten into another form. The controller reads the metrics of every
        check of the report, in the order of the checks and then of their
        metrics, and keeps one `RealismResult` for each. `metric` and `labels`
        are the name and the labels of the metric, and `observed` is its value.
        `target` and `passed` come from the check that holds the metric. For
        `realism.conformance_ratio` the target is `>= ` followed by the
        `threshold` of the check, and `passed` is the `passed` of the entry of
        `applications` whose `application` equals the label of the same name.
        For `realism.ks_statistic` and `realism.ks_p_value` the target is
        `p value >= ` followed by the `alpha` of the comparison of the same
        application and property (`request_bytes` and `response_bytes` are the
        `payload_size` comparisons of the direction `client` and `server`), and
        `passed` is true when its `status` is `pass`. The metrics that the
        other check kinds carry follow the table of `contracts/changes/CON-23.md`:
        `realism.check_failures` (every check carries one) has the target
        `== 0` and the `passed` of its check, `realism.parser_errors`,
        `realism.structure_failures`, and `realism.transport_deviations` have
        the target `== 0`, `realism.decrypted_ratio` has `>= ` followed by
        `min_decrypted`, `realism.ja4_match_ratio` has `>= 1`,
        `realism.duplicate_ratio` has `<= ` followed by `max_duplicate_ratio`,
        and the `mix.` metrics have a target that names `tolerance_points`. In
        each case `passed` is true when the value meets the target. Any other
        metric that a later version of the report format carries gets the
        target `check passed` and the `passed` of its check. Every check of
        the report carries `realism.check_failures`, so a check that fails
        always adds a result that shows it.

        The operation replaces. A run holds at most one realism report, a
        second call with a valid report replaces the first as a whole, and the
        response says so with `replaced`. A client that scores again, for
        example with other labels or a newer runner, therefore needs no
        delete. A report that the controller refuses leaves the earlier one
        unchanged. The operation is idempotent: the same document twice gives
        the same state.

        The run must have ended, which is the state `completed`, `failed`, or
        `aborted`, because the capture that the report scored is complete only
        then. A run in any other state answers 409. The controller does not
        compare `capture.sha256` with the digests of the capture files of the
        run, since the runner may have scored a merged or scrubbed copy, and it
        stores the digest as given. A token with the scope `run` may attach a
        report, so the results are what the client reported and not a
        measurement of the controller.

        The body is at most 4 MiB (4194304 bytes). Content type is
        `application/json` only.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "../../realism/schema/realism-report.schema.json" }
      responses:
        "200":
          description: Attached. The report holds the results from now on.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RealismAttachment" }
        "400":
          description: The body is not JSON.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "404":
          description: The run does not exist.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "409":
          description: The run has not ended, so its state is pending, preparing, running, or stopping. The problem detail names the state.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "413":
          description: The body is larger than 4 MiB.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "415":
          description: The content type is not application/json.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "422":
          description: >
            The document breaks the schema of the realism report, or two
            results of it have the same metric and labels. Each finding names a
            JSON Pointer into the document in `errors`.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /runs/{id}/captures:
    parameters:
      - { $ref: "#/components/parameters/Id" }
    get:
      tags: [runs]
      operationId: listCaptures
      x-required-scope: read
      responses:
        "200":
          description: Captures of the run.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Capture" } }
        default: { $ref: "#/components/responses/Problem" }
    post:
      tags: [runs]
      operationId: startCapture
      x-required-scope: run
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [port]
              properties:
                port:
                  type: string
                  description: >
                    Name of a port of the run's test configuration
                    (network.ports[].name). Required, so one capture records one
                    port. A client that wants several ports starts one capture
                    per port.
                bpf: { type: string, description: Berkeley Packet Filter expression. }
                max_bytes: { type: integer, minimum: 1, default: 104857600 }
                export_tls_keys:
                  type: boolean
                  default: false
                  description: >
                    Asks each agent to include the TLS key log lines in its
                    capture file (agent protocol 0.2.3 and later). An agent
                    that reports an older engine_api ignores the request and
                    writes the lines whenever it has them.
      responses:
        "202":
          description: Capture started.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Capture" }
        default: { $ref: "#/components/responses/Problem" }
  /runs/{id}/captures/{capture_id}:
    parameters:
      - { $ref: "#/components/parameters/Id" }
      - { name: capture_id, in: path, required: true, schema: { type: string } }
    get:
      tags: [runs]
      operationId: downloadCapture
      x-required-scope: read
      responses:
        "200":
          description: Capture file.
          content:
            application/vnd.tcpdump.pcap:
              schema: { type: string, contentMediaType: application/vnd.tcpdump.pcap }
        default: { $ref: "#/components/responses/Problem" }
  /runs/{id}/captures/{capture_id}:stop:
    parameters:
      - { $ref: "#/components/parameters/Id" }
      - { name: capture_id, in: path, required: true, schema: { type: string } }
    post:
      tags: [runs]
      operationId: stopCapture
      x-required-scope: run
      description: >
        Ends the capture on every agent without downloading it. The capture
        then has the state completed (or failed when no agent delivered an
        end), and its files are ready for downloadCapture. The operation is
        idempotent: a capture that already ended answers with its current
        state. Downloading a capture that still runs also ends it.
      responses:
        "200":
          description: The capture after the stop.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Capture" }
        default: { $ref: "#/components/responses/Problem" }
  /agents:
    get:
      tags: [agents]
      operationId: listAgents
      x-required-scope: read
      responses:
        "200":
          description: Registered agents.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Agent" } }
        default: { $ref: "#/components/responses/Problem" }
    post:
      tags: [agents]
      operationId: registerAgent
      x-required-scope: admin
      description: >
        Agents register themselves. Each agent dials the controller and calls
        Register of the gRPC ControllerService in
        contracts/proto/fps/agent/v1/agent.proto, so an agent needs no inbound
        port. This operation enrolls an agent identity ahead of time and sets
        its labels. The controller then accepts a Register call from an agent
        whose client certificate names that identity. The agent appears with
        state offline until it registers.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [id]
              properties:
                id: { type: string, description: Agent identity that the client certificate of the agent names. }
                labels: { type: object, additionalProperties: { type: string } }
      responses:
        "201":
          description: Enrolled.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Agent" }
        default: { $ref: "#/components/responses/Problem" }
  /agents/{id}:reserve:
    parameters:
      - { $ref: "#/components/parameters/Id" }
    post:
      tags: [agents]
      operationId: reserveAgent
      x-required-scope: run
      description: >
        Reserves the agent for the operator, so that the state of the agent is
        `reserved` and `reserved_by` is `operator`. Reserving an agent that the
        operator already holds is not an error: the operation is idempotent and
        answers 200 with the agent. The controller refuses with 409 when the
        agent is held by another holder (a run holds the agents that it uses, and
        `reserved_by` of the agent is the run identifier), when it has no open
        control session (state `offline`), and when it holds a plan that is not
        finished (state `busy`). The refusal is checked in this order, and the
        problem detail names the reason. The agent stays as it was.
      responses:
        "200":
          description: Reserved, or already reserved for the operator.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Agent" }
        "404":
          description: The agent is unknown.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "409":
          description: >
            The agent cannot be reserved because another holder has it, it is
            offline, or it is busy with a plan. Read the agent with listAgents
            for its state and `reserved_by`, and release it or wait.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /agents/{id}:release:
    parameters:
      - { $ref: "#/components/parameters/Id" }
    post:
      tags: [agents]
      operationId: releaseAgent
      x-required-scope: run
      responses:
        "200":
          description: Released.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Agent" }
        default: { $ref: "#/components/responses/Problem" }
components:
  securitySchemes:
    bearerToken:
      type: http
      scheme: bearer
      description: Scoped API token. Each operation names its required scope in x-required-scope (read, run, or admin).
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, pattern: "^[A-Za-z0-9_-]{1,64}$" }
    PageSize:
      name: page_size
      in: query
      schema: { type: integer, minimum: 1, maximum: 500, default: 50 }
    PageToken:
      name: page_token
      in: query
      schema: { type: string }
  responses:
    Problem:
      description: Error as RFC 9457 problem details.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
  schemas:
    Problem:
      type: object
      properties:
        type: { type: string, format: uri-reference, default: about:blank }
        title: { type: string }
        status: { type: integer, minimum: 400, maximum: 599 }
        detail: { type: string }
        instance: { type: string, format: uri-reference }
        errors:
          type: array
          items: { $ref: "#/components/schemas/Finding" }
    Finding:
      type: object
      required: [severity, path, message]
      properties:
        severity: { type: string, enum: [error, warning, info] }
        path: { type: string, description: JSON Pointer into the submitted document. }
        message: { type: string }
    ValidationReport:
      type: object
      required: [valid, findings]
      properties:
        valid: { type: boolean }
        findings: { type: array, items: { $ref: "#/components/schemas/Finding" } }
        capacity:
          type: object
          properties:
            agents_required: { type: integer }
            agents_available: { type: integer }
    ModuleType:
      type: string
      enum: [app, transport, host, content, tunnel, strike, evasion, fuzzer]
    ModuleSummary:
      type: object
      required: [name, version, type, license]
      properties:
        name: { type: string }
        version: { type: string }
        type: { $ref: "#/components/schemas/ModuleType" }
        license: { type: string }
        summary: { type: string }
        scenarios: { type: array, items: { type: string } }
        signed_by: { type: string }
    ConfigRef:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
        created_at: { type: string, format: date-time }
    Capabilities:
      type: object
      required: [engine_api, backends, agents, modules]
      properties:
        engine_api: { type: string, examples: ["0.1.0"] }
        api_version: { type: string, examples: ["0.1.0"] }
        controller_version:
          type: string
          description: Version of the controller build, such as a release number or a commit, and absent when the build carries none. It is not the REST contract version, which `api_version` gives.
          examples: ["0.4.0"]
        backends:
          type: array
          items: { type: string, enum: [kernel, af_xdp, dpdk] }
        agents: { type: array, items: { $ref: "#/components/schemas/Agent" } }
        modules: { type: array, items: { $ref: "#/components/schemas/ModuleSummary" } }
    Agent:
      type: object
      required: [id, state]
      properties:
        id: { type: string, description: Agent identity from its client certificate. }
        address: { type: string, description: Peer address of the open control session and absent while the agent is offline. }
        state: { type: string, enum: [online, offline, reserved, busy] }
        reserved_by:
          type: string
          description: >
            Holder of the reservation of the agent: `operator` for a reservation
            through reserveAgent, and the identifier of the run for an agent that
            a run uses. Present while any reservation exists, so it can also be
            present when `state` is `offline` or `busy`, which take precedence
            over `reserved`. A controller older than 0.10.0 does not send it.
          examples: ["operator"]
        version: { type: string }
        cores: { type: integer, minimum: 1 }
        backend: { type: string, enum: [kernel, af_xdp, dpdk] }
        ports:
          type: array
          items:
            type: object
            required: [name]
            properties:
              name: { type: string }
              driver: { type: string }
              speed_mbps: { type: integer }
        labels: { type: object, additionalProperties: { type: string } }
    RunState:
      type: string
      enum: [pending, preparing, running, stopping, completed, failed, aborted]
    Run:
      type: object
      required: [id, config_id, state]
      properties:
        id: { type: string }
        config_id: { type: string }
        state: { $ref: "#/components/schemas/RunState" }
        degraded: { type: boolean, description: True when an agent failed during the run. }
        reason:
          type: string
          description: >
            Why the run failed or was aborted, in words for an operator, such as
            the criterion that failed, the agent that failed, or the stop
            request. Absent while the run is in any other state.
          examples: ["criterion sessions.failed_ratio < 0.01 failed with 0.042"]
        phase: { type: string }
        created_at: { type: string, format: date-time }
        started_at: { type: string, format: date-time }
        ended_at: { type: string, format: date-time }
        seed: { type: integer }
        engine_version: { type: string }
        module_versions: { type: object, additionalProperties: { type: string } }
        summary: { $ref: "#/components/schemas/RunSummary" }
        verdict: { $ref: "#/components/schemas/RunVerdict" }
        calibration:
          type: array
          description: >
            The changes of the calibration factor of a run with a throughput_bps
            objective, oldest first. Absent for any other objective and while the
            factor stays at one. The controller keeps the newest 256 steps of a run.
          maxItems: 256
          items: { $ref: "#/components/schemas/CalibrationStep" }
    CalibrationStep:
      type: object
      description: One change of the calibration factor of a run.
      required: [time, factor, target, sessions_per_second]
      properties:
        time: { type: string, format: date-time, description: Controller clock time of the step. }
        factor:
          type: number
          format: double
          description: Scales every compiled session rate of the run from this step on.
        target:
          type: number
          format: double
          description: The factor that the estimates called for before the bounds of the step limited the move.
        sessions_per_second:
          type: number
          format: double
          description: The total session rate across the mix that the factor implies.
        entries:
          type: array
          description: The bytes per session estimate of each mix entry.
          items: { $ref: "#/components/schemas/CalibrationEntry" }
        multipliers:
          type: object
          description: >
            The byte mix multiplier of each mix entry by mix entry id, which scales
            the rate of the entry beside the factor. Absent for a run without byte
            weighted mix control, such as a run whose profile basis is not bytes.
          additionalProperties: { type: number, format: double }
    CalibrationEntry:
      type: object
      description: The calibration estimate of one mix entry.
      required: [id, bytes_per_session, measured]
      properties:
        id: { type: string, description: Mix entry id. }
        bytes_per_session:
          type: number
          format: double
          description: The estimate of application bytes per session that the next rates rest on.
        measured:
          type: boolean
          description: True when the estimate comes from measurements and not from the manifest estimate.
    RunVerdict:
      type: object
      description: Outcome of the pass and fail criteria of the test configuration.
      properties:
        passed: { type: boolean, description: True when every criterion passed and an agent survived the run. }
        criteria:
          type: array
          description: One result per criterion, in configuration order.
          items: { $ref: "#/components/schemas/CriterionResult" }
    CriterionResult:
      type: object
      description: >
        Result of one criterion. A criterion that compared a value carries
        observed and passed. A criterion whose metric has no value carries
        neither, and a criterion that the controller cannot evaluate carries
        passed false without observed. The reason says which case applies.
      properties:
        metric: { type: string, description: Metric name from contracts/metrics/catalog.yaml. }
        op: { type: string }
        value: { type: number }
        observed: { type: number, description: "Value of the metric over the whole run, absent when the metric has no value." }
        passed: { type: boolean, description: "Outcome of the comparison, absent when the metric has no value." }
        where:
          type: object
          minProperties: 1
          description: >
            The label filter of the criterion, exactly as `criteria[].where` of
            the test configuration states it: label names with the values that a
            series must carry for the criterion to count it, for example
            `{application: dns}`. Absent when the criterion has no filter. The
            controller does not add a `side` entry that the configuration left
            out, and a criterion without one counts the client side only for a
            metric that has the side label. Two results with the same metric,
            op, and value that differ only in their filter are told apart by
            this field.
          additionalProperties: { type: string }
          examples: [{ application: dns, side: server }]
        reason:
          type: string
          description: Why the criterion passed, failed, or has no result, in words for an operator.
          examples: ["observed 0.042 is not < 0.01", "metric sessions.response_time.p99 has no value"]
    RunSummary:
      type: object
      description: Whole run totals. Each property names its metric in contracts/metrics/catalog.yaml through x-fps-metric.
      properties:
        sessions_attempted: { type: integer, x-fps-metric: sessions.attempted }
        sessions_succeeded: { type: integer, x-fps-metric: sessions.succeeded }
        sessions_failed: { type: integer, x-fps-metric: sessions.failed }
        bytes_tx: { type: integer, x-fps-metric: bytes.tx }
        bytes_rx: { type: integer, x-fps-metric: bytes.rx }
        throughput_bps: { type: number, x-fps-metric: throughput.bps }
        sessions_per_second: { type: number, x-fps-metric: sessions.rate }
        concurrent_sessions: { type: integer, x-fps-metric: sessions.concurrent }
    MetricView:
      type: string
      enum: [application, scenario, port, tcp, tls, realism]
    MetricSample:
      type: object
      required: [ts, view, key, values]
      properties:
        ts: { type: string, format: date-time }
        view: { $ref: "#/components/schemas/MetricView" }
        key: { type: string, description: "Application, scenario, or port name that the sample describes." }
        values: { type: object, additionalProperties: { type: number, format: double }, description: Values keyed by metric name from contracts/metrics/catalog.yaml. }
    MetricStreamEnd:
      description: >-
        Data of the event `end` of streamRunMetrics, the last event of a
        stream. It follows the samples of the final tick.
      type: object
      required: [state]
      properties:
        state:
          description: >-
            State of the run when the stream ended: a RunState value of a final
            state, or `unknown` when the controller no longer knows the run.
          type: string
          examples: [completed]
    MetricSeriesSet:
      type: object
      required: [view, samples]
      properties:
        view: { $ref: "#/components/schemas/MetricView" }
        samples: { type: array, items: { $ref: "#/components/schemas/MetricSample" } }
    RunReport:
      type: object
      required: [run, realism]
      properties:
        run: { $ref: "#/components/schemas/Run" }
        scenarios:
          type: array
          description: >
            The counts of the run for each scenario of each application, ordered
            by application and then by scenario name. They are the client side
            series of the metric view `scenario` (the key of a sample there is
            `<application>/<scenario>`), so each session and each byte counts
            once, and the sum of an entry property over all entries equals the
            property of `run.summary` with the same name. A scenario appears
            once the run has recorded a counter for it. A controller of 0.9.0 or
            later always sends the property, empty when the run has recorded no
            scenario counter, and an older controller does not send it. For the
            totals of one application, sum the entries of that application.
          items: { $ref: "#/components/schemas/ScenarioTotals" }
        realism:
          type: array
          description: >
            The realism results that the controller holds for the run, in the
            order of the realism report that carried them. The controller does
            not measure realism itself. The realism runner (`python3 -m realism
            score`, whose report format is
            `realism/schema/realism-report.schema.json`) scores the capture of
            the run with independent classifiers and parsers, and each metric of
            a check of its report, with the verdict of the check, becomes one
            entry here. The same values are the `realism.` gauges of the metric
            view `realism`, and `mix.` gauges with `source: classifier`, when
            the controller holds them as series. Until the controller receives
            such a report for the run the array is empty, which is also the
            answer for a run whose capture was never scored. The operation
            attachRealismReport (`PUT /runs/{id}/realism`) delivers the report,
            replaces an earlier one, and describes how its metrics become the
            entries. Every check of the report carries the metric
            `realism.check_failures`, so a failing check always adds an entry.
          items: { $ref: "#/components/schemas/RealismResult" }
    ScenarioTotals:
      type: object
      description: >
        The counts of one scenario of one application over the whole run. The
        property names follow RunSummary, and each names its metric in
        contracts/metrics/catalog.yaml through x-fps-metric. A count is 0 when
        the run recorded no event for it.
      required: [application, scenario, sessions_attempted, sessions_succeeded, sessions_failed, bytes_tx, bytes_rx]
      properties:
        application: { type: string, description: "Module name of the application, for example http1." }
        scenario: { type: string, description: "Scenario name within the module, for example web_get." }
        sessions_attempted: { type: integer, minimum: 0, x-fps-metric: sessions.attempted }
        sessions_succeeded: { type: integer, minimum: 0, x-fps-metric: sessions.succeeded }
        sessions_failed:
          type: integer
          minimum: 0
          x-fps-metric: sessions.failed
          description: Sessions that failed for any reason, which is the sum over the reason label.
        bytes_tx: { type: integer, minimum: 0, x-fps-metric: bytes.tx }
        bytes_rx: { type: integer, minimum: 0, x-fps-metric: bytes.rx }
    RealismAttachment:
      type: object
      description: The answer to attachRealismReport.
      required: [realism, replaced]
      properties:
        realism:
          type: array
          description: The results that the controller now holds for the run, the same entries as `realism` of the report and in the same order.
          items: { $ref: "#/components/schemas/RealismResult" }
        replaced: { type: boolean, description: True when the run held a realism report before and this one replaced it. }
    RealismResult:
      type: object
      description: >
        One realism measurement of the run with its target and outcome. A
        reader that pairs results of two runs pairs them by `metric` and
        `labels` when the result has them, and by `property` otherwise.
      required: [property, observed, target, passed]
      properties:
        property:
          type: string
          description: Name of what was measured, in words for an operator, for example `conformance of http1 by ndpi`.
        observed: { type: number, description: The measured value. }
        target: { type: string, description: "The rule that the value must meet, such as `>= 0.99`." }
        passed: { type: boolean, description: True when the value meets the target. }
        metric:
          type: string
          description: Metric name from contracts/metrics/catalog.yaml that the result belongs to, for example `realism.conformance_ratio`.
        labels:
          type: object
          description: "The labels of the series, for example application http1 and classifier ndpi. Together with `metric` it is unique within one report."
          additionalProperties: { type: string }
    Capture:
      type: object
      required: [id, port, state]
      properties:
        id: { type: string }
        port: { type: string }
        state:
          type: string
          enum: [running, completed, failed]
          description: >
            running while an agent still captures. completed means that the
            files are ready to download, which includes a capture that
            stopCapture, a limit, or the end of the run ended.
        bytes: { type: integer }
        files:
          type: array
          description: >
            One entry per agent that was asked to capture, ordered by agent
            identity. A controller older than 0.6.0 does not send it.
          items: { $ref: "#/components/schemas/CaptureFile" }
    CaptureFile:
      type: object
      description: The part of a capture that one agent holds, and so the agent that produced it.
      required: [agent]
      properties:
        agent: { type: string, description: Identity of the agent that captured the file. }
        started: { type: boolean, description: False when the agent did not start the capture. }
        error: { type: string, description: Why the agent did not start the capture. Absent when it started. }
        packets: { type: integer, minimum: 0, description: "Packets written, known once the agent reported the end." }
        bytes: { type: integer, minimum: 0, description: "Size of the agent file, known once the agent reported the end." }
        dropped: { type: integer, minimum: 0, description: "Packets that the agent dropped, known once the agent reported the end." }
        digest: { type: string, description: "sha256: and 64 hex digits of the agent file, known once the agent reported the end." }
