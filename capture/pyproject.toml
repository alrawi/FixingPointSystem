# SPDX-License-Identifier: GPL-3.0-only
# Tool configuration of the capture compiler. The package runs from the repository
# root with `python3 -m capture`, and `pip install ./capture` installs it for
# `python3 -I -m capture`, which CI uses for commands that read captures.

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "fps-capture-tools"
version = "0.1.0"
description = "Capture compiler of FixingPointSystem: sessions, scenarios, scrubbing, profiles"
license = "GPL-3.0-only"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools]
package-dir = { "capture" = "." }
packages = ["capture"]

[tool.setuptools.package-data]
capture = ["*.json"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
