[package]
name = "fps-agent"
description = "FixingPointSystem agent: host capability detection, the standalone run mode, and the controller session"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "fps-agent"
path = "src/main.rs"

[dependencies]
# Pins the UDP worker threads to their plan cores, as fps-runtime does for TCP.
core_affinity = "0.8"
fps-backend-kernel = { path = "../fps-backend-kernel" }
fps-flow = { path = "../fps-flow" }
fps-hosts = { path = "../fps-hosts" }
fps-interp = { path = "../fps-interp" }
fps-module-dns = { path = "../../modules/dns/native" }
fps-module-http1 = { path = "../../modules/http1/native" }
fps-runtime = { path = "../fps-runtime" }
fps-sched = { path = "../fps-sched" }
fps-stats = { path = "../fps-stats" }
# The histogram type of fps-stats snapshots, for criteria over percentiles.
hdrhistogram = { version = "7", default-features = false }
# RngCore appears in the signature of the TemplateFn trait.
rand = { version = "0.8", default-features = false }
# Generated messages of agent.proto. Apache-2.0.
prost = "0.14"
prost-types = "0.14"
# The canonical JSON mapping of the plan.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# SHA-256 of module trees and scenario sources. MIT or Apache-2.0.
sha2 = "0.10"
# Error enums for library code, as docs/wiki/Coding-Standards.md requires.
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt", "rt-multi-thread", "signal", "sync", "time"] }
# The gRPC client of ControllerService and its generated stubs. The
# generated server stub lets tests run a fake controller in process. MIT.
tonic = "0.14"
tonic-prost = "0.14"
# Decodes the base64 histograms of fps-stats snapshots. MIT or Apache-2.0.
base64 = "0.22"
# Structured logs, as docs/wiki/Coding-Standards.md requires. MIT.
tracing = "0.1"
# JSON log lines of the binary. MIT.
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "json", "std"] }
# Adapts the outgoing session channel to the request stream. MIT.
tokio-stream = "0.1"

[build-dependencies]
# Compiles agent.proto in pure Rust, so the build needs no protoc. MIT or Apache-2.0.
protox = "0.9"
tonic-prost-build = "0.14"

[dev-dependencies]
# The fake controller of tests/session.rs serves on a loopback listener.
tokio-stream = { version = "0.1", features = ["net"] }
# A session generator for the native function tests.
rand_pcg = "0.3"
