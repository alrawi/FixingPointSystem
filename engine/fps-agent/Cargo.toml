[package]
name = "fps-agent"
description = "FixingPointSystem agent: host capability detection, the standalone run mode, and the controller session"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "fps-agent"
path = "src/main.rs"

[dependencies]
# Pins the UDP worker threads to their plan cores, as fps-runtime does for TCP.
core_affinity = "0.8"
fps-backend-kernel = { path = "../fps-backend-kernel" }
# The session capture ring that StartCapture and StopCapture serve.
fps-capture = { path = "../fps-capture" }
fps-flow = { path = "../fps-flow" }
fps-hosts = { path = "../fps-hosts" }
fps-interp = { path = "../fps-interp" }
# The DatagramIo trait of the tapped UDP sessions.
fps-io = { path = "../fps-io" }
# The first party modules of the registry in src/modules.rs (AGT-13).
fps-module-content = { path = "../../modules/content/native" }
fps-module-dns = { path = "../../modules/dns/native" }
fps-module-ftp = { path = "../../modules/ftp/native" }
fps-module-http1 = { path = "../../modules/http1/native" }
fps-module-http2 = { path = "../../modules/http2/native" }
fps-module-imap = { path = "../../modules/imap/native" }
fps-module-pop3 = { path = "../../modules/pop3/native" }
fps-module-smtp = { path = "../../modules/smtp/native" }
# The TLS profiles, authority, and key log of the runs with tls_upgrade (AGT-14).
fps-module-tls = { path = "../../modules/tls/native" }
fps-runtime = { path = "../fps-runtime" }
fps-sched = { path = "../fps-sched" }
fps-stats = { path = "../fps-stats" }
# CloseReason of the extension sessions that the UDP workers close, and the
# limits of the extensions that the agent loads (AGT-11).
fps-wasm = { path = "../fps-wasm" }
# The histogram type of fps-stats snapshots, for criteria over percentiles.
hdrhistogram = { version = "7", default-features = false }
# The base point multiple that derives the authority key from the run seed (AGT-14). MIT or Apache-2.0.
num-bigint = "0.4"
# RngCore appears in the signature of the TemplateFn trait.
rand = { version = "0.8", default-features = false }
# Generated messages of agent.proto. Apache-2.0.
prost = "0.14"
prost-types = "0.14"
# The canonical JSON mapping of the plan.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# SHA-256 of module trees and scenario sources. MIT or Apache-2.0.
sha2 = "0.10"
# Error enums for library code, as docs/wiki/Coding-Standards.md requires.
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "signal", "sync", "time"] }
# The gRPC client of ControllerService and its generated stubs. The
# generated server stub lets tests run a fake controller in process. MIT.
tonic = { version = "0.14", features = ["tls-ring"] }
tonic-prost = "0.14"
# Mutual TLS, enrollment, and renewal (AGT-08). rustls with the ring provider
# is the stack of fps-module-tls, so the lock gains tokio-rustls and nothing
# else of weight. rcgen makes the P-256 key and the CSR. hyper sends the
# HTTPS requests to the enrollment endpoint. All are MIT or Apache-2.0.
bytes = "1"
http-body-util = "0.1"
hyper = { version = "1", default-features = false, features = ["client", "http1"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = "1"
# Reads the RFC 3339 times of the enrollment answer.
time = { version = "0.3", default-features = false, features = ["parsing", "std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
# Decodes the base64 histograms of fps-stats snapshots. MIT or Apache-2.0.
base64 = "0.22"
# Ed25519 verification of module signatures (AGT-04). ring is already in the
# lock through rustls, so the lock gains no package. ISC-style license of ring.
ring = "0.17"
# Structured logs, as docs/wiki/Coding-Standards.md requires. MIT.
tracing = "0.1"
# JSON log lines of the binary. MIT.
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "json", "std"] }
# Adapts the outgoing session channel to the request stream. MIT.
tokio-stream = "0.1"

[build-dependencies]
# Compiles agent.proto in pure Rust, so the build needs no protoc. MIT or Apache-2.0.
protox = "0.9"
tonic-prost-build = "0.14"

[dev-dependencies]
# tests/mtls.rs runs a fake enrollment server and a fake controller over TLS.
# rcgen needs x509-parser to read the CSR of the agent. MIT or Apache-2.0.
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem", "x509-parser"] }
hyper = { version = "1", default-features = false, features = ["server", "client", "http1"] }
time = { version = "0.3", default-features = false, features = ["formatting", "parsing", "std"] }
# The fake controller of tests/session.rs serves on a loopback listener.
tokio-stream = { version = "0.1", features = ["net"] }
# A session generator for the native function tests.
rand_pcg = "0.3"
# tests/extensions.rs builds the extension component of fps-wasm from WAT, as
# the tests of fps-runtime do. Apache-2.0 WITH LLVM-exception.
wat = "1"
wit-component = "0.254"
wit-parser = { version = "0.254", default-features = false, features = ["std"] }
