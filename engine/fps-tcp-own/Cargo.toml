[package]
name = "fps-tcp-own"
description = "The own user space TCP stack of the FixingPointSystem engine: IPv4 and TCP over a frame link, a timer heap with one entry per connection, and sessions that implement SessionIo, with no dependency on smoltcp"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
fps-backend-afxdp = { path = "../fps-backend-afxdp" }
fps-io = { path = "../fps-io" }
thiserror = "2"
tokio = { version = "1.54", features = ["io-util", "rt", "sync", "time"] }

[dev-dependencies]
tokio = { version = "1.54", features = ["io-util", "macros", "net", "rt", "time"] }
