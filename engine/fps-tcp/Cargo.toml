[package]
name = "fps-tcp"
description = "TCP stack bench harness of the FixingPointSystem engine, which drives user space TCP stacks behind SessionIo and measures session rate, throughput, and socket scaling"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
fps-io = { path = "../fps-io" }
smoltcp = { version = "0.14", default-features = false, features = ["std", "medium-ip", "proto-ipv4", "socket-tcp", "async"] }
thiserror = "2"
tokio = { version = "1", features = ["io-util", "rt", "time"] }

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "macros", "rt", "time"] }
