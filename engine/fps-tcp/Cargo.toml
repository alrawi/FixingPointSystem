[package]
name = "fps-tcp"
description = "TCP stack bench harness of the FixingPointSystem engine, which drives TCP stacks behind SessionIo and measures session rate, throughput, and socket scaling, with the kernel loopback TCP as the reference stack"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
fps-io = { path = "../fps-io" }
thiserror = "2"
tokio = { version = "1.54", features = ["io-util", "net", "rt", "time"] }

[dev-dependencies]
tokio = { version = "1.54", features = ["io-util", "macros", "net", "rt", "time"] }
