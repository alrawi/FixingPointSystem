[package]
name = "fps-tcp"
description = "TCP stack bench harness of the FixingPointSystem engine, which drives TCP stacks behind SessionIo (the kernel loopback TCP as the reference, an own stack, and smoltcp) and measures session rate, throughput, and socket scaling"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
fps-backend-afxdp = { path = "../fps-backend-afxdp" }
fps-io = { path = "../fps-io" }
fps-tcp-own = { path = "../fps-tcp-own" }
smoltcp = { version = "0.14", default-features = false, features = ["std", "medium-ip", "proto-ipv4", "socket-tcp", "async"] }
thiserror = "2"
tokio = { version = "1.54", features = ["io-util", "net", "rt", "sync", "time"] }

[dev-dependencies]
tokio = { version = "1.54", features = ["io-util", "macros", "net", "rt", "time"] }

[[test]]
name = "netns"
harness = false
