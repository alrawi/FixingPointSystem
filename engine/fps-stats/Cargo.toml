[package]
name = "fps-stats"
description = "Counters and histograms of the FixingPointSystem engine"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# Encodes the hdr_v2 field of HistogramValue. Base64 is the proto3 JSON form of bytes.
base64 = "0.22"
# HDR histograms and their compressed V2 encoding, which HistogramValue.hdr_v2 names.
hdrhistogram = { version = "7", default-features = false, features = ["serialization"] }
# The proto3 JSON mapping of CounterSnapshot.
serde_json = "1"
# Error enums for library code, as docs/wiki/Coding-Standards.md requires.
thiserror = "2"

[dev-dependencies]
proptest = "1"
serde = { version = "1", features = ["derive"] }
# serde_norway is a maintained fork of the deprecated serde_yaml (RUSTSEC-2024-0449).
serde_yaml = { package = "serde_norway", version = "0.9" }
