[package]
name = "fps-interp"
description = "Flow program interpreter of the FixingPointSystem engine"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# The read buffer of a session, which advances without copying.
bytes = "1"
fps-flow = { path = "../fps-flow" }
fps-io = { path = "../fps-io" }
# Substring search for expect pattern.
memchr = "2"
rand = { version = "0.8", default-features = false }
# Exponential, lognormal, and Pareto delays. Version 0.4 matches rand 0.8.
rand_distr = "0.4"
rand_pcg = "0.3"
# Error enums for library code, as docs/wiki/Coding-Standards.md requires.
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "time"] }

[dev-dependencies]
proptest = "1"
# serde_norway is a maintained fork of the deprecated serde_yaml (RUSTSEC-2024-0449).
serde_yaml = { package = "serde_norway", version = "0.9" }
tokio = { version = "1", features = ["io-util", "macros", "rt", "test-util", "time"] }
