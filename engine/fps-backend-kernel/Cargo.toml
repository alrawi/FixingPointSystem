[package]
name = "fps-backend-kernel"
description = "Kernel transport backend of the FixingPointSystem engine, which implements SessionIo over TCP and DatagramIo over UDP Linux sockets"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
fps-interp = { path = "../fps-interp" }
fps-io = { path = "../fps-io" }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
# serde_norway is a maintained fork of the deprecated serde_yaml (RUSTSEC-2024-0449).
serde_norway = "0.9"
socket2 = { version = "0.6", features = ["all"] }
thiserror = "2"
tokio = { version = "1", features = ["io-util", "net", "time"] }

[dev-dependencies]
fps-flow = { path = "../fps-flow" }
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "sync", "time"] }
