[package]
name = "fps-datapath"
description = "The user space datapath of the FixingPointSystem engine: a loop per AF_XDP queue that splits ARP, ND, DHCP, TCP, and UDP frames between fps-hosts and the user space stacks, and offers connect and listen like the kernel backend"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
fps-backend-afxdp = { path = "../fps-backend-afxdp" }
fps-hosts = { path = "../fps-hosts" }
fps-tcp-own = { path = "../fps-tcp-own" }
fps-udp-own = { path = "../fps-udp-own" }
thiserror = "2"
tokio = { version = "1.54", features = ["rt", "sync", "time"] }

[dev-dependencies]
tokio = { version = "1.54", features = ["io-util", "macros", "rt", "sync", "time"] }
