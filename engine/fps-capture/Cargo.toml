[package]
name = "fps-capture"
description = "Session sampling and capture of the FixingPointSystem engine, which mirrors a seeded sample of sessions into a bounded pcapng ring with TLS key logs"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
fps-io = { path = "../fps-io" }
thiserror = "2"
tokio = { version = "1", features = ["io-util"] }

[dev-dependencies]
fps-module-tls = { path = "../../modules/tls/native" }
tokio = { version = "1", features = ["io-util", "macros", "rt", "time"] }
