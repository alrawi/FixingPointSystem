[workspace]
resolver = "2"
# Members are globs, so a new crate under spikes/, engine/, or modules/<name>/native
# joins the workspace without an edit to this file. Cargo fails on a glob that
# matches nothing, so modules/_template/native keeps the module glob matching.
# Spikes without Rust code are excluded by name.
members = ["spikes/*", "engine/*", "modules/*/native", "tests/golden/rust"]
exclude = ["spikes/s3-afxdp", "spikes/s4-trex-astf"]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "GPL-3.0-only"
repository = "https://github.com/alrawi/FixingPointSystem"
publish = false

[profile.release]
lto = "thin"
codegen-units = 1
debug = 1
