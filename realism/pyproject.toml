# SPDX-License-Identifier: GPL-3.0-only
# Tool configuration of the realism runner. The package runs from the repository
# root with `python3 -m realism`, and `pip install ./realism` installs it for
# `python3 -I -m realism`, which CI uses for commands that read captures.

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "fps-realism"
version = "0.1.0"
description = "Realism checks for FixingPointSystem captures"
license = "GPL-3.0-only"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
yaml = ["PyYAML>=6.0"]

[tool.setuptools]
package-dir = { "realism" = "." }
packages = ["realism", "realism.schema"]

[tool.setuptools.package-data]
"realism.schema" = ["*.json"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
