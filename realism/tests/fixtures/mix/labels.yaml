# Labels of mix.pcap, a capture of 8 HTTP sessions (port 80) and 2 DNS lookups (port 53) that
# realism/tests/pcapgen.py builds (Capture.tcp_session and Capture.dns_lookup, request
# "GET / HTTP/1.1\r\nHost: a\r\n\r\n", response of 29 bytes). The sessions share is 80 and 20
# percent, the payload bytes share 448 of 612 and 164 of 612.
labels: fps-realism-labels
version: 1
sessions:
  - application: http1
    match: {transport: tcp, server_port: 80}
  - application: dns
    match: {transport: udp, server_port: 53}
mix:
  scenarios:
    http1/web_get: http1
    dns/lookup: dns
