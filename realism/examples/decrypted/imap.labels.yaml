# SPDX-License-Identifier: GPL-3.0-only
# Labels of the decrypted view of modules/imap/fixtures/imap.pcapng. The STARTTLS sessions
# run on port 1143 in the capture. The view carries only the dialogue inside TLS, on
# port 143: nDPI names a stream IMAPS when it holds the STARTTLS exchange, and gives no
# label to the pre-upgrade lines joined to the dialogue, while the dialogue inside TLS
# alone is IMAP.
#
#   python3 -m realism decrypted --pcap modules/imap/fixtures/imap.pcapng \
#     --labels realism/examples/decrypted/imap.labels.yaml \
#     --view-port 143 --sessions 8
labels: fps-realism-labels
version: 1
threshold: 0.99
sessions:
  - application: starttls_decrypted
    match: {transport: tcp, server_port: 143}
applications:
  starttls_decrypted: {ndpi: [IMAP]}
