# SPDX-License-Identifier: GPL-3.0-only
# Expected labels of imap.pcapng, which capture.sh records in the QA-01 harness.
# Every session of the fixture is IMAP on TCP port 143, and nDPI must classify
# at least 99% of them as IMAP from payload alone. realism/schema/labels.schema.json
# defines the format.
labels: fps-realism-labels
version: 1
threshold: 0.99
sessions:
  - application: imap
    match: {transport: tcp, server_port: 143}
applications:
  imap: {ndpi: [IMAP]}
