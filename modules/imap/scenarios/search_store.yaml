scenario: search_store
description: A mail client on port 143 that finds, reads, flags, and deletes messages. After CAPABILITY, LOGIN, and SELECT it sends SEARCH UNSEEN, and the server lists hits message numbers. The client reads the first number out of the response with imap.search_hit, fetches that message with BODY[], which the server answers with the implied \Seen flag, and sets the flags with STORE +FLAGS. A second SEARCH by sender yields another message, which the client marks \Deleted and removes with EXPUNGE and CLOSE. The server answers STORE from the command line in last, and it keeps the STORE command in a variable to report the EXPUNGE numbers. The scenario needs hits not above messages.
vars:
  server_port: 143
  server_name: imap.example.test
  messages: 6
  hits: 2
  body_size: 1500
  attachment_min: 24000
  attachment_max: 160000
  tag: A000
flows:
  - id: search_store
    module: imap
    client:
      - connect: { port: "{{ vars.server_port }}" }
      - expect: { pattern: "\r\n", timeout_ms: 5000 }
      - set: { tag: "{{ imap.next(vars.tag) }}" }
      - send: "{{ vars.tag }} CAPABILITY\r\n"
      - expect: { pattern: "secs).\r\n", timeout_ms: 5000 }
      - set:
          login: "{{ imap.credential('user') }}"
          secret: "{{ imap.credential('password') }}"
      - set: { tag: "{{ imap.next(vars.tag) }}" }
      - send: "{{ vars.tag }} LOGIN \"{{ vars.login }}\" \"{{ vars.secret }}\"\r\n"
      - expect: { pattern: " Logged in\r\n", timeout_ms: 5000 }
      - set: { tag: "{{ imap.next(vars.tag) }}" }
      - send: "{{ vars.tag }} SELECT \"INBOX\"\r\n"
      - expect: { pattern: "secs).\r\n", timeout_ms: 5000 }
      - set: { tag: "{{ imap.next(vars.tag) }}" }
      - send: "{{ vars.tag }} SEARCH UNSEEN\r\n"
      - expect: { pattern: "secs).\r\n", timeout_ms: 5000 }
      - set: { unread: "{{ imap.search_hit(last) }}" }
      - set: { tag: "{{ imap.next(vars.tag) }}" }
      - send: "{{ vars.tag }} FETCH {{ vars.unread }} (UID FLAGS BODY[])\r\n"
      - expect: { pattern: "secs).\r\n", timeout_ms: 30000 }
      - set: { tag: "{{ imap.next(vars.tag) }}" }
      - send: "{{ vars.tag }} STORE {{ vars.unread }} +FLAGS (\\Seen \\Flagged)\r\n"
      - expect: { pattern: "secs).\r\n", timeout_ms: 5000 }
      - delay: { dist: exponential, mean_ms: 60 }
      - set: { sid: "{{ rand_int(1, 2000000000) }}" }
      - set: { tag: "{{ imap.next(vars.tag) }}" }
      - send: "{{ vars.tag }} SEARCH FROM \"{{ imap.address(vars.sid, 1) }}\" SINCE 1-Jan-2026\r\n"
      - expect: { pattern: "secs).\r\n", timeout_ms: 5000 }
      - set: { junk: "{{ imap.search_hit(last, index=1) }}" }
      - set: { tag: "{{ imap.next(vars.tag) }}" }
      - send: "{{ vars.tag }} STORE {{ vars.junk }} +FLAGS (\\Deleted)\r\n"
      - expect: { pattern: "secs).\r\n", timeout_ms: 5000 }
      - set: { tag: "{{ imap.next(vars.tag) }}" }
      - send: "{{ vars.tag }} EXPUNGE\r\n"
      - expect: { pattern: "secs).\r\n", timeout_ms: 5000 }
      - set: { tag: "{{ imap.next(vars.tag) }}" }
      - send: "{{ vars.tag }} CLOSE\r\n"
      - expect: { pattern: "secs).\r\n", timeout_ms: 5000 }
      - set: { tag: "{{ imap.next(vars.tag) }}" }
      - send: "{{ vars.tag }} LOGOUT\r\n"
      - expect: { pattern: "secs).\r\n", timeout_ms: 5000 }
      - close: fin
    server:
      - accept: { port: "{{ vars.server_port }}" }
      - send: "* OK [CAPABILITY IMAP4rev1 SASL-IR LOGIN-REFERRALS ID ENABLE IDLE AUTH=PLAIN] {{ vars.server_name }} Dovecot ready.\r\n"
      - expect: { pattern: "\r\n", timeout_ms: 5000 }
      - send: "* CAPABILITY IMAP4rev1 SASL-IR LOGIN-REFERRALS ID ENABLE IDLE AUTH=PLAIN\r\n{{ imap.tagged(last, text='Pre-login capabilities listed, post-login capabilities have more', timing=true) }}"
      - expect: { pattern: "\r\n", timeout_ms: 5000 }
      - send: "{{ imap.tagged(last, code='CAPABILITY IMAP4rev1 SASL-IR LOGIN-REFERRALS ID ENABLE IDLE SORT UIDPLUS MOVE NAMESPACE CHILDREN', text='Logged in') }}"
      - expect: { pattern: "\r\n", timeout_ms: 5000 }
      - send: "{{ imap.select_data(vars.messages, unseen=1) }}{{ imap.tagged(last, code='READ-WRITE', text='Select completed', timing=true) }}"
      - expect: { pattern: "\r\n", timeout_ms: 5000 }
      - send: "{{ imap.search_reply(vars.messages, vars.hits) }}{{ imap.tagged(last, text='Search completed', timing=true) }}"
      - expect: { pattern: "\r\n", timeout_ms: 5000 }
      - set: { sid: "{{ rand_int(1, 2000000000) }}" }
      - set:
          subject: "Newsletter {{ rand_int(1000, 9999) }}"
          text: "{{ content.email(size=vars.body_size) }}"
      - set: { msg: "{{ imap.message(imap.address(vars.sid, 1), imap.address(vars.sid, 2), vars.subject, vars.text, attachment=content.binary(kind='gzip', size=rand_int(vars.attachment_min, vars.attachment_max)), filename='digest.csv.gz', content_type='application/gzip') }}" }
      - send: "{{ imap.fetch(last, vars.msg) }}{{ imap.tagged(last, text='Fetch completed', timing=true) }}"
      - expect: { pattern: "\r\n", timeout_ms: 5000 }
      - send: "{{ imap.store_reply(last) }}{{ imap.tagged(last, text='Store completed', timing=true) }}"
      - expect: { pattern: "\r\n", timeout_ms: 5000 }
      - send: "{{ imap.search_reply(vars.messages, vars.hits) }}{{ imap.tagged(last, text='Search completed', timing=true) }}"
      - expect: { pattern: "\r\n", timeout_ms: 5000 }
      - set: { stored: "{{ last }}" }
      - send: "{{ imap.store_reply(last) }}{{ imap.tagged(last, text='Store completed', timing=true) }}"
      - expect: { pattern: "\r\n", timeout_ms: 5000 }
      - send: "{{ imap.expunge_reply(vars.stored) }}{{ imap.tagged(last, text='Expunge completed', timing=true) }}"
      - expect: { pattern: "\r\n", timeout_ms: 5000 }
      - send: "{{ imap.tagged(last, text='Close completed', timing=true) }}"
      - expect: { pattern: "\r\n", timeout_ms: 5000 }
      - send: "* BYE Logging out\r\n{{ imap.tagged(last, text='Logout completed', timing=true) }}"
      - close: fin
