scenario: retr_epsv
description: A file download over an extended passive mode data connection. After the login, SYST, PWD, and CWD the client switches to binary mode, asks for the size of a file with SIZE, and sends EPSV, whose 229 reply names the port and no address. The server spawns the data flow before its 229 reply, so the port is open when the client learns it, and the client spawns it after it sends RETR. In the data flow the server sends a PDF from the content module and the client reads the number of bytes that the 213 reply announced. The server draws the content seed in its SIZE handler, so the 213 reply and the later data have the same length.
vars:
  server_port: 21
  data_port_min: 50000
  data_port_max: 50999
  server_banner: (vsFTPd 3.0.5)
  login_dir: /srv/ftp
  work_dir: /srv/ftp/exports
  file_min: 40000
  file_max: 400000
flows:
  - id: control
    module: ftp
    client:
      - connect: { port: "{{ vars.server_port }}" }
      - expect: { pattern: "\r\n", timeout_ms: 5000 }
      - send: "USER {{ ftp.credential('user') }}\r\n"
      - expect: { pattern: "\r\n", timeout_ms: 5000 }
      - send: "PASS {{ ftp.credential('password') }}\r\n"
      - expect: { pattern: "\r\n", timeout_ms: 5000 }
      - send: "SYST\r\n"
      - expect: { pattern: "\r\n", timeout_ms: 5000 }
      - send: "PWD\r\n"
      - expect: { pattern: "\r\n", timeout_ms: 5000 }
      - send: "CWD {{ vars.work_dir }}\r\n"
      - expect: { pattern: "\r\n", timeout_ms: 5000 }
      - set: { file: "{{ ftp.file_name(rand_int(1, 2000000000), ext='pdf') }}" }
      - send: "TYPE I\r\n"
      - expect: { pattern: "\r\n", timeout_ms: 5000 }
      - send: "SIZE {{ vars.file }}\r\n"
      - expect: { pattern: "\r\n", timeout_ms: 5000 }
      - set: { file_size: "{{ ftp.number(last) }}" }
      - send: "EPSV\r\n"
      - expect: { pattern: "\r\n", timeout_ms: 5000 }
      - set: { data_port: "{{ ftp.epsv_port(last) }}" }
      - send: "RETR {{ vars.file }}\r\n"
      - spawn: { flow: data }
      - expect: { pattern: "\r\n", timeout_ms: 5000 }
      - expect: { pattern: "\r\n", timeout_ms: 30000 }
      - send: "QUIT\r\n"
      - expect: { pattern: "\r\n", timeout_ms: 5000 }
      - close: fin
    server:
      - accept: { port: "{{ vars.server_port }}" }
      - send: "220 {{ vars.server_banner }}\r\n"
      - expect: { pattern: "\r\n", timeout_ms: 5000 }
      - send: "331 Please specify the password.\r\n"
      - expect: { pattern: "\r\n", timeout_ms: 5000 }
      - send: "230 Login successful.\r\n"
      - expect: { pattern: "\r\n", timeout_ms: 5000 }
      - send: "215 UNIX Type: L8\r\n"
      - expect: { pattern: "\r\n", timeout_ms: 5000 }
      - send: "257 \"{{ vars.login_dir }}\" is the current directory\r\n"
      - expect: { pattern: "\r\n", timeout_ms: 5000 }
      - send: "250 Directory successfully changed.\r\n"
      - expect: { pattern: "\r\n", timeout_ms: 5000 }
      - send: "200 Switching to Binary mode.\r\n"
      - expect: { pattern: "\r\n", timeout_ms: 5000 }
      - set:
          file_seed: "{{ rand_int(1, 2000000000) }}"
          want: "{{ rand_int(vars.file_min, vars.file_max) }}"
      - set: { file_size: "{{ ftp.length(content.binary(kind='pdf', size=vars.want, seed=vars.file_seed)) }}" }
      - send: "213 {{ vars.file_size }}\r\n"
      - expect: { pattern: "\r\n", timeout_ms: 5000 }
      - set: { data_port: "{{ rand_int(vars.data_port_min, vars.data_port_max) }}" }
      - spawn: { flow: data }
      - delay: { dist: uniform, min_ms: 1, max_ms: 3 }
      - send: "{{ ftp.epsv_reply(vars.data_port) }}"
      - expect: { pattern: "\r\n", timeout_ms: 5000 }
      - send: "150 Opening BINARY mode data connection for {{ ftp.arg(last) }} ({{ vars.file_size }} bytes).\r\n"
      - delay: { dist: uniform, min_ms: 10, max_ms: 40 }
      - send: "226 Transfer complete.\r\n"
      - expect: { pattern: "\r\n", timeout_ms: 5000 }
      - send: "221 Goodbye.\r\n"
      - close: fin
  - id: data
    module: ftp
    spawned: true
    client:
      - connect: { port: "{{ vars.data_port }}" }
      - expect: { bytes: "{{ vars.file_size }}", timeout_ms: 30000 }
      - close: fin
    server:
      - accept: { port: "{{ vars.data_port }}" }
      - delay: { dist: uniform, min_ms: 1, max_ms: 4 }
      - send: "{{ content.binary(kind='pdf', size=vars.want, seed=vars.file_seed) }}"
      - close: fin
