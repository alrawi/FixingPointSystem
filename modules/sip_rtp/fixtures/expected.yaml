# Expected labels of sip_rtp.pcapng, which capture.sh records in the QA-01 harness.
# The signaling session of every call is SIP on UDP port 5060. The media session
# of a call runs between two dynamic ports, so no rule names it and the default
# labels it as RTP. nDPI must classify at least 99% of the sessions of each
# application from payload alone. realism/schema/labels.schema.json defines the
# format.
labels: fps-realism-labels
version: 1
threshold: 0.99
sessions:
  - application: sip
    match: {transport: udp, server_port: 5060}
default: rtp
applications:
  sip: {ndpi: [SIP]}
  rtp: {ndpi: [RTP]}
# The temporal section holds the packet interval of the media. The packet time is
# the ptime_ms variable of a call, which the scenarios draw from 20 and 30 ms in
# the committed capture. The check judges each direction of each RTP stream alone
# against the listed time that is nearest to its median gap, requires 90% of its
# gaps within 8 ms of it, and fails when a stream drifts, bursts, or jitters.
temporal:
  packets:
    applications:
      rtp: {dist: constant, ms: [20, 30], tolerance_ms: 8, within: 0.9}
