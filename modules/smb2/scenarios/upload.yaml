scenario: upload
description: A client that uploads one file to a share. After the NTLM session setup and the tree connect it creates the file, writes upload_size octets with WRITE requests of write_size octets, closes the file, and tears the session down. The server acknowledges every WRITE with the count of the request. A flow has no arithmetic, so the last write has its own length, upload_tail, which must be upload_size minus the full writes, that is upload_size modulo write_size, or write_size when the size is a multiple of it. The client counts the full writes with smb2.chunks and numbers its messages and offsets with smb2.add. The data comes from the seeded fill() generator.
vars:
  server_port: 445
  share: '\\fps-files.example.test\data'
  user: alice
  password: Tst-quartz-meadow-41
  domain: FPS
  workstation: WS-0417
  dialects: '2.0.2,2.1'
  dialect: '2.1'
  upload_name: 'Projects\backup-2026-11.bin'
  upload_size: 1048576
  write_size: 65536
  # The length of the last write, see the description.
  upload_tail: 65536
flows:
  - id: upload
    module: smb2
    client:
      - connect: { port: "{{ vars.server_port }}" }
      - send: "{{ smb2.negotiate(dialects=vars.dialects, message_id=0) }}"
      - expect: { bytes: 4, timeout_ms: 5000 }
      - expect: { bytes: "{{ smb2.message_length(last) }}", timeout_ms: 5000 }
      - send: "{{ smb2.session_setup(smb2.ntlm_negotiate(domain=vars.domain, workstation=vars.workstation), 1) }}"
      - expect: { bytes: 4, timeout_ms: 5000 }
      - expect: { bytes: "{{ smb2.message_length(last) }}", timeout_ms: 5000 }
      - set:
          sid: "{{ smb2.header_field(last, 'session_id') }}"
          # A set action keeps text, so the token travels as hexadecimal digits.
          auth: "{{ smb2.hex(smb2.ntlm_authenticate(smb2.security_blob(last), vars.user, vars.password, domain=vars.domain, workstation=vars.workstation)) }}"
      - send: "{{ smb2.session_setup(smb2.unhex(vars.auth), 2, session_id=vars.sid) }}"
      - expect: { bytes: 4, timeout_ms: 5000 }
      - expect: { bytes: "{{ smb2.message_length(last) }}", timeout_ms: 5000 }
      - send: "{{ smb2.tree_connect(vars.share, 3, vars.sid) }}"
      - expect: { bytes: 4, timeout_ms: 5000 }
      - expect: { bytes: "{{ smb2.message_length(last) }}", timeout_ms: 5000 }
      - set:
          tid: "{{ smb2.header_field(last, 'tree_id') }}"
          mid: "{{ smb2.add(3) }}"
      # Create the file: FILE_CREATE, with write access.
      - send: "{{ smb2.create(vars.upload_name, vars.mid, vars.sid, vars.tid, desired_access=1180063, disposition=2, file_attributes=128) }}"
      - expect: { bytes: 4, timeout_ms: 5000 }
      - expect: { bytes: "{{ smb2.message_length(last) }}", timeout_ms: 5000 }
      - set:
          fid: "{{ smb2.body_field(last, 'file_id') }}"
          mid: "{{ smb2.add(vars.mid) }}"
          offset: "0"
      # All writes but the last carry write_size octets. A call that is nested
      # in another call gives octets, so the count goes through a variable.
      - set: { writes: "{{ smb2.chunks(vars.upload_size, vars.write_size) }}" }
      - set: { full_writes: "{{ smb2.add(vars.writes, -1) }}" }
      - loop:
          count: "{{ vars.full_writes }}"
          do:
            - send: "{{ smb2.write(vars.fid, fill(vars.write_size), vars.mid, vars.sid, vars.tid, offset=vars.offset) }}"
            - expect: { bytes: 4, timeout_ms: 30000 }
            - expect: { bytes: "{{ smb2.message_length(last) }}", timeout_ms: 30000 }
            - set:
                mid: "{{ smb2.add(vars.mid) }}"
                offset: "{{ smb2.add(vars.offset, vars.write_size) }}"
      - send: "{{ smb2.write(vars.fid, fill(vars.upload_tail), vars.mid, vars.sid, vars.tid, offset=vars.offset) }}"
      - expect: { bytes: 4, timeout_ms: 30000 }
      - expect: { bytes: "{{ smb2.message_length(last) }}", timeout_ms: 30000 }
      - set: { mid: "{{ smb2.add(vars.mid) }}" }
      - send: "{{ smb2.close(vars.fid, vars.mid, vars.sid, vars.tid) }}"
      - expect: { bytes: 4, timeout_ms: 5000 }
      - expect: { bytes: "{{ smb2.message_length(last) }}", timeout_ms: 5000 }
      - set: { mid: "{{ smb2.add(vars.mid) }}" }
      - send: "{{ smb2.tree_disconnect(vars.mid, vars.sid, vars.tid) }}"
      - expect: { bytes: 4, timeout_ms: 5000 }
      - expect: { bytes: "{{ smb2.message_length(last) }}", timeout_ms: 5000 }
      - set: { mid: "{{ smb2.add(vars.mid) }}" }
      - send: "{{ smb2.logoff(vars.mid, vars.sid) }}"
      - expect: { bytes: 4, timeout_ms: 5000 }
      - expect: { bytes: "{{ smb2.message_length(last) }}", timeout_ms: 5000 }
      - close: fin
    server:
      - accept: { port: "{{ vars.server_port }}" }
      - set:
          # The ids that this server gives to the session and to the tree.
          session: "{{ rand_int(1048576, 2147483647) }}"
          tree: "{{ rand_int(1, 65535) }}"
      - expect: { bytes: 4, timeout_ms: 5000 }
      - expect: { bytes: "{{ smb2.message_length(last) }}", timeout_ms: 5000 }
      - send: "{{ smb2.negotiate_response(dialect=vars.dialect) }}"
      - expect: { bytes: 4, timeout_ms: 5000 }
      - expect: { bytes: "{{ smb2.message_length(last) }}", timeout_ms: 5000 }
      - send: "{{ smb2.session_setup_response(smb2.ntlm_challenge(target=vars.domain), 1, vars.session, status='more_processing_required') }}"
      - expect: { bytes: 4, timeout_ms: 5000 }
      - expect: { bytes: "{{ smb2.message_length(last) }}", timeout_ms: 5000 }
      - send: "{{ smb2.session_setup_response(smb2.spnego_accept(), 2, vars.session) }}"
      - expect: { bytes: 4, timeout_ms: 5000 }
      - expect: { bytes: "{{ smb2.message_length(last) }}", timeout_ms: 5000 }
      - send: "{{ smb2.tree_connect_response(3, vars.session, vars.tree) }}"
      # CREATE of the new file, which the server reports as created.
      - expect: { bytes: 4, timeout_ms: 5000 }
      - expect: { bytes: "{{ smb2.message_length(last) }}", timeout_ms: 5000 }
      - set: { rid: "{{ smb2.header_field(last, 'message_id') }}" }
      - send: "{{ smb2.create_response(vars.rid, vars.session, vars.tree, action=2) }}"
      # One WRITE per chunk, answered with the count of the request.
      - loop:
          count: "{{ smb2.chunks(vars.upload_size, vars.write_size) }}"
          do:
            - expect: { bytes: 4, timeout_ms: 30000 }
            - expect: { bytes: "{{ smb2.message_length(last) }}", timeout_ms: 30000 }
            - set:
                rid: "{{ smb2.header_field(last, 'message_id') }}"
                count: "{{ smb2.body_field(last, 'length') }}"
            - send: "{{ smb2.write_response(vars.count, vars.rid, vars.session, vars.tree) }}"
      # CLOSE, TREE_DISCONNECT, and LOGOFF.
      - expect: { bytes: 4, timeout_ms: 5000 }
      - expect: { bytes: "{{ smb2.message_length(last) }}", timeout_ms: 5000 }
      - set: { rid: "{{ smb2.header_field(last, 'message_id') }}" }
      - send: "{{ smb2.close_response(vars.rid, vars.session, vars.tree, size=vars.upload_size) }}"
      - expect: { bytes: 4, timeout_ms: 5000 }
      - expect: { bytes: "{{ smb2.message_length(last) }}", timeout_ms: 5000 }
      - set: { rid: "{{ smb2.header_field(last, 'message_id') }}" }
      - send: "{{ smb2.tree_disconnect_response(vars.rid, vars.session, vars.tree) }}"
      - expect: { bytes: 4, timeout_ms: 5000 }
      - expect: { bytes: "{{ smb2.message_length(last) }}", timeout_ms: 5000 }
      - set: { rid: "{{ smb2.header_field(last, 'message_id') }}" }
      - send: "{{ smb2.logoff_response(vars.rid, vars.session) }}"
      - close: fin
