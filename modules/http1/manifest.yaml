apiVersion: fixingpoint.dev/v1alpha1
kind: Module
name: http1
version: 0.1.0
type: app
summary: HTTP/1.0 and HTTP/1.1 clients and servers for single fetches, keepalive browsing, and uploads with length delimited or chunked bodies, in the clear and over TLS 1.2 and 1.3 with browser profiles.
engine_api: ">=0.2, <0.3"
license: GPL-3.0-only
provides:
  - { protocol: http, transport: tcp, port: 80 }
  - { protocol: http, transport: tcp, port: 8080 }
  - { protocol: https, transport: tcp, port: 443 }
  - { protocol: https, transport: tcp, port: 8443 }
parameters:
  type: object
  additionalProperties: false
  properties:
    host: { type: string, minLength: 1, default: www.example.test, description: Host header value. }
    path: { type: string, minLength: 1, default: /index.html, description: Request target of single fetches. }
    server_port: { type: integer, minimum: 1, maximum: 65535, default: 8080, description: "TCP port of the server side. The https scenarios default to 8443 to 8446, one port per scenario, so a capture tells them apart." }
    body_size: { type: integer, minimum: 0, maximum: 16777216, default: 4096, description: Response body size in bytes for single fetches. }
    page_size: { type: integer, minimum: 0, maximum: 16777216, default: 18000, description: Size of the chunked HTML page of a browsing session. }
    object_size: { type: integer, minimum: 0, maximum: 16777216, default: 12000, description: Size of each embedded object of a browsing session. }
    objects: { type: integer, minimum: 1, maximum: 1000, default: 6, description: Embedded objects fetched per page on one keepalive connection. }
    chunk_size: { type: integer, minimum: 1, maximum: 16777216, default: 4096, description: Chunk size of chunked bodies. }
    upload_size: { type: integer, minimum: 0, maximum: 16777216, default: 65536, description: Request body size of uploads. }
functions:
  - name: request
    summary: Request line and header block, ending with the empty line, followed by a length delimited or chunked body.
    params:
      - { name: method, type: text }
      - { name: path, type: text }
      - { name: host, type: text }
      - { name: accept, type: text, default: "*/*" }
      - { name: version, type: text, default: "1.1" }
      - { name: body, type: bytes, default: "" }
      - { name: content_type, type: text, default: "" }
      - { name: chunked, type: boolean, default: false }
      - { name: chunk_size, type: int, default: 8192 }
      - { name: connection, type: text, default: "" }
      - { name: user_agent, type: text, default: "Mozilla/5.0 (X11; Linux x86_64) FixingPointSystem/0.1" }
  - name: response
    summary: Status line, Server, Content-Type, and Content-Length or Transfer-Encoding headers, the empty line, and the body.
    params:
      - { name: status, type: int }
      - { name: body, type: bytes, default: "" }
      - { name: content_type, type: text, default: text/html }
      - { name: version, type: text, default: "1.1" }
      - { name: chunked, type: boolean, default: false }
      - { name: chunk_size, type: int, default: 8192 }
      - { name: connection, type: text, default: "" }
      - { name: server, type: text, default: fps/0.1 }
scenarios:
  - scenarios/single_fetch.yaml
  - scenarios/keepalive_browse.yaml
  - scenarios/upload.yaml
  - scenarios/upload_chunked.yaml
  - scenarios/http10_fetch.yaml
  - scenarios/http10_keepalive.yaml
  - scenarios/https_fetch.yaml
  - scenarios/https_keepalive_browse.yaml
  - scenarios/https_fetch_tls12.yaml
  - scenarios/https_keepalive_browse_tls12.yaml
expected_bytes:
  single_fetch: 4390
  keepalive_browse: 91800
  upload: 132000
  upload_chunked: 66000
  http10_fetch: 4310
  http10_keepalive: 13100
  https_fetch: 4450
  https_keepalive_browse: 92000
  https_fetch_tls12: 4460
  https_keepalive_browse_tls12: 92300
fixtures:
  - { capture: fixtures/http1.pcapng, expect: { ndpi: [HTTP, TLS] } }
provenance:
  source: synthetic
  notes: Messages follow RFC 9110 and RFC 9112 for HTTP/1.1 and RFC 1945 for HTTP/1.0. Every body comes from the seeded fill() generator, and every host name lies under the reserved .test domain.
