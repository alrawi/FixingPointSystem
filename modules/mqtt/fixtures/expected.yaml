# SPDX-License-Identifier: GPL-3.0-only
# Expected labels of mqtt.pcapng, which capture.sh records in the QA-01 harness.
# Every connection of the fixture is MQTT on TCP port 1883, half of them in
# MQTT 3.1.1 and half in MQTT 5.0, and nDPI must classify at least 99% of them
# as MQTT from the CONNECT packet alone.
# realism/schema/labels.schema.json defines the format.
labels: fps-realism-labels
version: 1
threshold: 0.99
sessions:
  - application: mqtt
    match: {transport: tcp, server_port: 1883}
applications:
  mqtt: {ndpi: [MQTT]}
