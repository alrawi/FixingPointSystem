scenario: publish_qos1
description: A sensor that publishes at QoS 1. After CONNECT and CONNACK the client announces itself with a retained status message on vars.status_topic, then publishes vars.messages JSON readings to vars.topic with a random gap between vars.interval_min_ms and vars.interval_max_ms. Every PUBLISH carries a packet identifier that counts up from 1, and the broker answers each with a PUBACK for that identifier before the client sends the next. The session ends with DISCONNECT. vars.version 4 runs MQTT 3.1.1 and 5 runs MQTT 5.0, where vars.session_expiry and vars.content_type add a property to the CONNECT and to each reading when they are set, and the PUBACK leaves out the reason of a success. Both sides read each packet with one expect of one byte and six expects of mqtt.feed(last) bytes, and mqtt.recv checks the packet against the standard.
vars:
  server_port: 1883
  version: 4
  keepalive: 60
  session_expiry: -1
  client_prefix: mqttjs_
  user: sensor-0412
  password: Tst-amber-falcon-27
  topic: fps/site-3/sensors/telemetry
  status_topic: fps/site-3/sensors/status
  content_type: ""
  messages: 6
  interval_min_ms: 500
  interval_max_ms: 3000
flows:
  - id: session
    module: mqtt
    client:
      - connect: { port: "{{ vars.server_port }}" }
      - send: "{{ mqtt.connect(mqtt.client_id(vars.client_prefix), version=vars.version, keepalive=vars.keepalive, user=vars.user, password=vars.password, session_expiry=vars.session_expiry) }}"
      - expect: { bytes: 1, timeout_ms: 10000 }
      - loop:
          count: 6
          do:
            - expect: { bytes: "{{ mqtt.feed(last) }}", timeout_ms: 10000 }
      - set: { got: "{{ mqtt.recv('connack') }}" }
      - send: "{{ mqtt.publish(vars.status_topic, 'online', qos=1, retain=true) }}"
      - expect: { bytes: 1, timeout_ms: 10000 }
      - loop:
          count: 6
          do:
            - expect: { bytes: "{{ mqtt.feed(last) }}", timeout_ms: 10000 }
      - set: { got: "{{ mqtt.recv('puback') }}" }
      - loop:
          count: "{{ vars.messages }}"
          do:
            - delay: { ms: "{{ rand_int(vars.interval_min_ms, vars.interval_max_ms) }}" }
            - send: "{{ mqtt.publish(vars.topic, mqtt.reading(), qos=1, content_type=vars.content_type) }}"
            - expect: { bytes: 1, timeout_ms: 10000 }
            - loop:
                count: 6
                do:
                  - expect: { bytes: "{{ mqtt.feed(last) }}", timeout_ms: 10000 }
            - set: { got: "{{ mqtt.recv('puback') }}" }
      - delay: { ms: "{{ rand_int(vars.interval_min_ms, vars.interval_max_ms) }}" }
      - send: "{{ mqtt.disconnect() }}"
      - close: fin
    server:
      - accept: { port: "{{ vars.server_port }}" }
      - expect: { bytes: 1, timeout_ms: 10000 }
      - loop:
          count: 6
          do:
            - expect: { bytes: "{{ mqtt.feed(last) }}", timeout_ms: 10000 }
      - set: { got: "{{ mqtt.recv('connect') }}" }
      - delay: { ms: "{{ rand_int(2, 12) }}" }
      - send: "{{ mqtt.connack() }}"
      - expect: { bytes: 1, timeout_ms: 10000 }
      - loop:
          count: 6
          do:
            - expect: { bytes: "{{ mqtt.feed(last) }}", timeout_ms: 10000 }
      - set: { got: "{{ mqtt.recv('publish:1') }}" }
      - delay: { ms: "{{ rand_int(1, 6) }}" }
      - send: "{{ mqtt.puback() }}"
      - loop:
          count: "{{ vars.messages }}"
          do:
            - expect: { bytes: 1, timeout_ms: 3600000 }
            - loop:
                count: 6
                do:
                  - expect: { bytes: "{{ mqtt.feed(last) }}", timeout_ms: 10000 }
            - set: { got: "{{ mqtt.recv('publish:1') }}" }
            - delay: { ms: "{{ rand_int(1, 6) }}" }
            - send: "{{ mqtt.puback() }}"
      - expect: { bytes: 1, timeout_ms: 3600000 }
      - loop:
          count: 6
          do:
            - expect: { bytes: "{{ mqtt.feed(last) }}", timeout_ms: 10000 }
      - set: { got: "{{ mqtt.recv('disconnect') }}" }
      - close: fin
