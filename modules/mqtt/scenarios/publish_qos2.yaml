scenario: publish_qos2
description: A meter that publishes vars.messages readings at QoS 2, the exactly once flow. Each PUBLISH carries a packet identifier that counts up from 1 and starts a four packet exchange for that identifier, which is PUBLISH from the client, PUBREC from the broker, PUBREL from the client, and PUBCOMP from the broker. The client sends the next PUBLISH only after the PUBCOMP. The session ends with DISCONNECT. vars.version 4 runs MQTT 3.1.1 and 5 runs MQTT 5.0, whose acknowledgments leave out the reason of a success. Both sides read each packet with one expect of one byte and six expects of mqtt.feed(last) bytes, and mqtt.recv checks the packet against the standard, including the fixed flags of PUBREL.
vars:
  server_port: 1883
  version: 4
  keepalive: 60
  session_expiry: -1
  client_prefix: mqttjs_
  user: meter-0087
  password: Tst-cobalt-heron-52
  topic: fps/site-3/meters/readings
  messages: 6
  interval_min_ms: 500
  interval_max_ms: 3000
flows:
  - id: session
    module: mqtt
    client:
      - connect: { port: "{{ vars.server_port }}" }
      - send: "{{ mqtt.connect(mqtt.client_id(vars.client_prefix), version=vars.version, keepalive=vars.keepalive, user=vars.user, password=vars.password, session_expiry=vars.session_expiry) }}"
      - expect: { bytes: 1, timeout_ms: 10000 }
      - loop:
          count: 6
          do:
            - expect: { bytes: "{{ mqtt.feed(last) }}", timeout_ms: 10000 }
      - set: { got: "{{ mqtt.recv('connack') }}" }
      - loop:
          count: "{{ vars.messages }}"
          do:
            - delay: { ms: "{{ rand_int(vars.interval_min_ms, vars.interval_max_ms) }}" }
            - send: "{{ mqtt.publish(vars.topic, mqtt.reading('meter-0087'), qos=2) }}"
            - expect: { bytes: 1, timeout_ms: 10000 }
            - loop:
                count: 6
                do:
                  - expect: { bytes: "{{ mqtt.feed(last) }}", timeout_ms: 10000 }
            - set: { got: "{{ mqtt.recv('pubrec') }}" }
            - send: "{{ mqtt.pubrel() }}"
            - expect: { bytes: 1, timeout_ms: 10000 }
            - loop:
                count: 6
                do:
                  - expect: { bytes: "{{ mqtt.feed(last) }}", timeout_ms: 10000 }
            - set: { got: "{{ mqtt.recv('pubcomp') }}" }
      - delay: { ms: "{{ rand_int(vars.interval_min_ms, vars.interval_max_ms) }}" }
      - send: "{{ mqtt.disconnect() }}"
      - close: fin
    server:
      - accept: { port: "{{ vars.server_port }}" }
      - expect: { bytes: 1, timeout_ms: 10000 }
      - loop:
          count: 6
          do:
            - expect: { bytes: "{{ mqtt.feed(last) }}", timeout_ms: 10000 }
      - set: { got: "{{ mqtt.recv('connect') }}" }
      - delay: { ms: "{{ rand_int(2, 12) }}" }
      - send: "{{ mqtt.connack() }}"
      - loop:
          count: "{{ vars.messages }}"
          do:
            - expect: { bytes: 1, timeout_ms: 3600000 }
            - loop:
                count: 6
                do:
                  - expect: { bytes: "{{ mqtt.feed(last) }}", timeout_ms: 10000 }
            - set: { got: "{{ mqtt.recv('publish:2') }}" }
            - delay: { ms: "{{ rand_int(1, 6) }}" }
            - send: "{{ mqtt.pubrec() }}"
            - expect: { bytes: 1, timeout_ms: 10000 }
            - loop:
                count: 6
                do:
                  - expect: { bytes: "{{ mqtt.feed(last) }}", timeout_ms: 10000 }
            - set: { got: "{{ mqtt.recv('pubrel') }}" }
            - delay: { ms: "{{ rand_int(1, 6) }}" }
            - send: "{{ mqtt.pubcomp() }}"
      - expect: { bytes: 1, timeout_ms: 3600000 }
      - loop:
          count: 6
          do:
            - expect: { bytes: "{{ mqtt.feed(last) }}", timeout_ms: 10000 }
      - set: { got: "{{ mqtt.recv('disconnect') }}" }
      - close: fin
