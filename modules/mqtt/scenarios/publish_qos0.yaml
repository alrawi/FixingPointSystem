scenario: publish_qos0
description: A sensor that publishes telemetry at QoS 0. The client connects with a user name and a password, reads the CONNACK, publishes vars.messages JSON readings to vars.topic with a random gap between vars.interval_min_ms and vars.interval_max_ms, and ends with DISCONNECT. The broker accepts the connection, reads every PUBLISH, and sends no acknowledgment, as QoS 0 has none. vars.version 4 runs MQTT 3.1.1 and 5 runs MQTT 5.0, whose CONNECT and CONNACK carry properties, and a vars.session_expiry of 0 or more adds the Session Expiry Interval to the CONNECT. Both sides read each packet with one expect of one byte and six expects of mqtt.feed(last) bytes, and mqtt.recv checks the packet against the standard.
vars:
  server_port: 1883
  version: 4
  keepalive: 60
  session_expiry: -1
  client_prefix: mqttjs_
  user: sensor-0412
  password: Tst-amber-falcon-27
  topic: fps/site-3/sensors/telemetry
  messages: 6
  interval_min_ms: 500
  interval_max_ms: 3000
flows:
  - id: session
    module: mqtt
    client:
      - connect: { port: "{{ vars.server_port }}" }
      - send: "{{ mqtt.connect(mqtt.client_id(vars.client_prefix), version=vars.version, keepalive=vars.keepalive, user=vars.user, password=vars.password, session_expiry=vars.session_expiry) }}"
      - expect: { bytes: 1, timeout_ms: 10000 }
      - loop:
          count: 6
          do:
            - expect: { bytes: "{{ mqtt.feed(last) }}", timeout_ms: 10000 }
      - set: { got: "{{ mqtt.recv('connack') }}" }
      - loop:
          count: "{{ vars.messages }}"
          do:
            - delay: { ms: "{{ rand_int(vars.interval_min_ms, vars.interval_max_ms) }}" }
            - send: "{{ mqtt.publish(vars.topic, mqtt.reading(), qos=0) }}"
      - delay: { ms: "{{ rand_int(vars.interval_min_ms, vars.interval_max_ms) }}" }
      - send: "{{ mqtt.disconnect() }}"
      - close: fin
    server:
      - accept: { port: "{{ vars.server_port }}" }
      - expect: { bytes: 1, timeout_ms: 10000 }
      - loop:
          count: 6
          do:
            - expect: { bytes: "{{ mqtt.feed(last) }}", timeout_ms: 10000 }
      - set: { got: "{{ mqtt.recv('connect') }}" }
      - delay: { ms: "{{ rand_int(2, 12) }}" }
      - send: "{{ mqtt.connack() }}"
      - loop:
          count: "{{ vars.messages }}"
          do:
            - expect: { bytes: 1, timeout_ms: 3600000 }
            - loop:
                count: 6
                do:
                  - expect: { bytes: "{{ mqtt.feed(last) }}", timeout_ms: 10000 }
            - set: { got: "{{ mqtt.recv('publish:0') }}" }
      - expect: { bytes: 1, timeout_ms: 3600000 }
      - loop:
          count: 6
          do:
            - expect: { bytes: "{{ mqtt.feed(last) }}", timeout_ms: 10000 }
      - set: { got: "{{ mqtt.recv('disconnect') }}" }
      - close: fin
