scenario: rootdse_probe
description: The first contact of a client with a directory server, as a monitoring tool, a mail client, or a Windows machine makes it. The client binds anonymously, reads the root DSE with a base object search on the empty DN to learn the naming contexts and the supported protocol version, searches the naming context for its own base entry, and unbinds. The sessions are short, about 700 octets in each direction, and they add small anonymous exchanges to a mix. An empty vars.directory selects the directory that ships with the module, whose first entry is the root DSE.
vars:
  server_port: 389
  directory: ""
  context: dc=example,dc=test
  root_attributes: namingContexts,supportedLDAPVersion,supportedSASLMechanisms,subschemaSubentry,vendorName
flows:
  - id: session
    module: ldap
    client:
      - connect: { port: "{{ vars.server_port }}" }
      - send: "{{ ldap.bind_request(1, '', '') }}"
      - expect: { bytes: 4, timeout_ms: 5000 }
      - expect: { bytes: "{{ ldap.size(last) }}", timeout_ms: 5000 }
      - set: { got: "{{ ldap.recv(last, 'bind_response') }}" }
      - set:
          roots: "{{ ldap.count(vars.directory, '', 'base') }}"
      - send: "{{ ldap.search_request(2, '', 'base', '(objectClass=*)', vars.root_attributes) }}"
      - loop:
          count: "{{ vars.roots }}"
          do:
            - expect: { bytes: 4, timeout_ms: 5000 }
            - expect: { bytes: "{{ ldap.size(last) }}", timeout_ms: 5000 }
            - set: { got: "{{ ldap.recv(last, 'search_entry') }}" }
      - expect: { bytes: 4, timeout_ms: 5000 }
      - expect: { bytes: "{{ ldap.size(last) }}", timeout_ms: 5000 }
      - set: { got: "{{ ldap.recv(last, 'search_done') }}" }
      - delay: { dist: lognormal, mu: 4.0, sigma: 0.6, unit: ms }
      - set:
          contexts: "{{ ldap.count(vars.directory, vars.context, 'base') }}"
      - send: "{{ ldap.search_request(3, vars.context, 'base', '(objectClass=*)', 'description') }}"
      - loop:
          count: "{{ vars.contexts }}"
          do:
            - expect: { bytes: 4, timeout_ms: 5000 }
            - expect: { bytes: "{{ ldap.size(last) }}", timeout_ms: 5000 }
            - set: { got: "{{ ldap.recv(last, 'search_entry') }}" }
      - expect: { bytes: 4, timeout_ms: 5000 }
      - expect: { bytes: "{{ ldap.size(last) }}", timeout_ms: 5000 }
      - set: { got: "{{ ldap.recv(last, 'search_done') }}" }
      - send: "{{ ldap.unbind_request(4) }}"
      - close: fin
    server:
      - accept: { port: "{{ vars.server_port }}" }
      - expect: { bytes: 4, timeout_ms: 10000 }
      - expect: { bytes: "{{ ldap.size(last) }}", timeout_ms: 10000 }
      - set: { got: "{{ ldap.recv(last, 'bind_request') }}" }
      - send: "{{ ldap.bind_answer(vars.directory) }}"
      - expect: { bytes: 4, timeout_ms: 10000 }
      - expect: { bytes: "{{ ldap.size(last) }}", timeout_ms: 10000 }
      - set: { got: "{{ ldap.recv(last, 'search_request') }}" }
      - set: { roots: "{{ ldap.matches(vars.directory) }}" }
      - loop:
          count: "{{ vars.roots }}"
          do:
            - send: "{{ ldap.search_next() }}"
      - send: "{{ ldap.search_end() }}"
      - expect: { bytes: 4, timeout_ms: 10000 }
      - expect: { bytes: "{{ ldap.size(last) }}", timeout_ms: 10000 }
      - set: { got: "{{ ldap.recv(last, 'search_request') }}" }
      - set: { contexts: "{{ ldap.matches(vars.directory) }}" }
      - loop:
          count: "{{ vars.contexts }}"
          do:
            - send: "{{ ldap.search_next() }}"
      - send: "{{ ldap.search_end() }}"
      - expect: { bytes: 4, timeout_ms: 10000 }
      - expect: { bytes: "{{ ldap.size(last) }}", timeout_ms: 10000 }
      - set: { got: "{{ ldap.recv(last, 'unbind_request') }}" }
      - close: fin
