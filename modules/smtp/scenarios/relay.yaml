scenario: relay
description: A mail relay between two servers on port 25 without authentication. The client sends one message with three recipients and a PNG attachment, one command at a time, and the server answers each command before the next one. The text part ends with a line that starts with a dot, so the DATA payload exercises dot stuffing.
vars:
  server_port: 25
  client_name: mail-gw.example.test
  server_name: mx.example.test
  body_size: 1800
  attachment_min: 24000
  attachment_max: 160000
flows:
  - id: relay
    module: smtp
    client:
      - connect: { port: "{{ vars.server_port }}" }
      - expect: { pattern: "\r\n", timeout_ms: 5000 }
      - send: "EHLO {{ vars.client_name }}\r\n"
      - expect: { pattern: "\r\n250 ", timeout_ms: 5000 }
      - expect: { pattern: "\r\n", timeout_ms: 5000 }
      - set: { sid: "{{ rand_int(1, 2000000000) }}" }
      - set:
          subject: "Statement ST-{{ rand_int(100000, 999999) }}"
          text: "{{ content.email(size=vars.body_size) }}\n.\nThe line above holds a single dot.\n.. and this line starts with two.\n"
      - send: "MAIL FROM:<{{ smtp.address(vars.sid, 0) }}>\r\n"
      - expect: { pattern: "\r\n", timeout_ms: 5000 }
      - send: "{{ smtp.rcpt_to(vars.sid, 1, 1) }}"
      - expect: { pattern: "\r\n", timeout_ms: 5000 }
      - send: "{{ smtp.rcpt_to(vars.sid, 1, 2) }}"
      - expect: { pattern: "\r\n", timeout_ms: 5000 }
      - send: "{{ smtp.rcpt_to(vars.sid, 1, 3) }}"
      - expect: { pattern: "\r\n", timeout_ms: 5000 }
      - send: "DATA\r\n"
      - expect: { pattern: "\r\n", timeout_ms: 5000 }
      - send: "{{ smtp.data(smtp.message(smtp.address(vars.sid, 0), smtp.recipients(vars.sid, 2), vars.subject, vars.text, cc=smtp.address(vars.sid, 3), attachment=content.binary(kind='png', size=rand_int(vars.attachment_min, vars.attachment_max)), filename='scan.png', content_type='image/png')) }}"
      - expect: { pattern: "\r\n", timeout_ms: 30000 }
      - send: "QUIT\r\n"
      - expect: { pattern: "\r\n", timeout_ms: 5000 }
      - close: fin
    server:
      - accept: { port: "{{ vars.server_port }}" }
      - send: "220 {{ vars.server_name }} ESMTP Postfix\r\n"
      - expect: { pattern: "\r\n", timeout_ms: 5000 }
      - send: "{{ smtp.ehlo_reply(vars.server_name, vars.client_name) }}"
      - expect: { pattern: "\r\n", timeout_ms: 5000 }
      - send: "250 2.1.0 Ok\r\n"
      - loop:
          count: 3
          do:
            - expect: { pattern: "\r\n", timeout_ms: 5000 }
            - send: "250 2.1.5 Ok\r\n"
      - expect: { pattern: "\r\n", timeout_ms: 5000 }
      - send: "354 End data with <CR><LF>.<CR><LF>\r\n"
      - expect: { pattern: "\r\n.\r\n", timeout_ms: 30000 }
      - send: "250 2.0.0 Ok: queued as {{ rand_int(100000, 999999) }}\r\n"
      - expect: { pattern: "\r\n", timeout_ms: 5000 }
      - send: "221 2.0.0 Bye\r\n"
      - close: fin
