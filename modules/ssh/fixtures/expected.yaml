# SPDX-License-Identifier: GPL-3.0-only
# Expected labels of ssh.pcapng, which capture.sh records in the QA-01 harness.
# Every connection of the fixture is SSH on TCP port 22, and nDPI must classify
# at least 99% of them as SSH from the banner and the key exchange alone.
# realism/schema/labels.schema.json defines the format.
labels: fps-realism-labels
version: 1
threshold: 0.99
sessions:
  - application: ssh
    match: {transport: tcp, server_port: 22}
applications:
  ssh: {ndpi: [SSH]}
