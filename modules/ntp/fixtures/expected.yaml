# SPDX-License-Identifier: GPL-3.0-only
# Expected labels of ntp.pcapng, which capture.sh records in the QA-01 harness.
# Every session of the fixture is NTP on UDP port 123, and nDPI must classify at
# least 99% of them as NTP from payload alone. realism/schema/labels.schema.json
# defines the format.
labels: fps-realism-labels
version: 1
threshold: 0.99
sessions:
  - application: ntp
    match: {transport: udp, server_port: 123}
applications:
  ntp: {ndpi: [NTP]}
