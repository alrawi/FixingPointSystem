[package]
name = "fps-module-tls"
description = "TLS transport module of the FixingPointSystem engine, which wraps SessionIo sessions in TLS 1.2 and 1.3 with rustls"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
fps-io = { path = "../../../engine/fps-io" }
# The ring provider and the feature set match spike S2, so the crate links the
# same GPL-3.0 compatible code (decision D4).
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
thiserror = "2"
tokio = { version = "1", features = ["io-util", "time"] }

[dev-dependencies]
fps-backend-kernel = { path = "../../../engine/fps-backend-kernel" }
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "sync", "time", "test-util"] }

# The module layout keeps tests in modules/tls/tests, next to the module
# directory, so the targets point one directory up.
[[test]]
name = "sessions"
path = "../tests/sessions.rs"

[[test]]
name = "capture"
path = "../tests/capture.rs"
