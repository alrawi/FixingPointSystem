scenario: top_preview
description: A mail client on port 110 that previews the headers of its messages before it downloads any. After USER, PASS, STAT, and the full LIST it sends TOP n preview_lines (default 10) for each of the variable fetches (default 3) messages. Each answer is the headers, the blank line, and the first lines of the body of a MIME message with an attachment, dot stuffed and closed by a line with a single dot. The client then asks for UIDL 1 in its single line form, downloads message 1 with RETR, and ends with QUIT. The server draws its messages from the content module.
vars:
  server_port: 110
  server_name: pop3.example.test
  messages: 6
  fetches: 3
  preview_lines: 10
  body_size: 1800
  attachment_min: 24000
  attachment_max: 160000
  n: 0
flows:
  - id: top_preview
    module: pop3
    client:
      - connect: { port: "{{ vars.server_port }}" }
      - expect: { pattern: "\r\n", timeout_ms: 5000 }
      - set:
          login: "{{ pop3.credential('user') }}"
          secret: "{{ pop3.credential('password') }}"
      - send: "USER {{ vars.login }}\r\n"
      - expect: { pattern: "\r\n", timeout_ms: 5000 }
      - send: "PASS {{ vars.secret }}\r\n"
      - expect: { pattern: "\r\n", timeout_ms: 5000 }
      - send: "STAT\r\n"
      - expect: { pattern: "\r\n", timeout_ms: 5000 }
      - send: "LIST\r\n"
      - expect: { pattern: "\r\n.\r\n", timeout_ms: 5000 }
      - loop:
          count: "{{ vars.fetches }}"
          do:
            - set: { n: "{{ pop3.next(vars.n) }}" }
            - send: "TOP {{ vars.n }} {{ vars.preview_lines }}\r\n"
            - expect: { pattern: "\r\n.\r\n", timeout_ms: 30000 }
            - delay: { dist: exponential, mean_ms: 60 }
      - send: "UIDL 1\r\n"
      - expect: { pattern: "\r\n", timeout_ms: 5000 }
      - send: "RETR 1\r\n"
      - expect: { pattern: "\r\n.\r\n", timeout_ms: 30000 }
      - send: "QUIT\r\n"
      - expect: { pattern: "\r\n", timeout_ms: 5000 }
      - close: fin
    server:
      - accept: { port: "{{ vars.server_port }}" }
      - set: { box: "{{ rand_int(1, 2000000000) }}" }
      - send: "+OK Dovecot ready. {{ pop3.banner(vars.server_name) }}\r\n"
      - expect: { pattern: "\r\n", timeout_ms: 5000 }
      - send: "+OK\r\n"
      - expect: { pattern: "\r\n", timeout_ms: 5000 }
      - send: "+OK Logged in.\r\n"
      - expect: { pattern: "\r\n", timeout_ms: 5000 }
      - send: "{{ pop3.stat_reply(vars.messages, vars.box) }}"
      - expect: { pattern: "\r\n", timeout_ms: 5000 }
      - send: "{{ pop3.list_reply(last, vars.messages, vars.box) }}"
      - loop:
          count: "{{ vars.fetches }}"
          do:
            - expect: { pattern: "\r\n", timeout_ms: 30000 }
            - set: { sid: "{{ rand_int(1, 2000000000) }}" }
            - set:
                subject: "Invoice {{ rand_int(1000, 9999) }}"
                text: "{{ content.email(size=vars.body_size) }}"
            - set: { msg: "{{ pop3.message(pop3.address(vars.sid, 1), pop3.address(vars.sid, 2), vars.subject, vars.text, attachment=content.binary(kind='pdf', size=vars.attachment_min), filename='invoice.pdf', content_type='application/pdf') }}" }
            - send: "{{ pop3.top_reply(last, vars.msg, vars.messages) }}"
      - expect: { pattern: "\r\n", timeout_ms: 5000 }
      - send: "{{ pop3.uidl_reply(last, vars.messages, vars.box) }}"
      - expect: { pattern: "\r\n", timeout_ms: 5000 }
      - set: { sid: "{{ rand_int(1, 2000000000) }}" }
      - set:
          subject: "Invoice {{ rand_int(1000, 9999) }}"
          text: "{{ content.email(size=vars.body_size) }}"
      - set: { msg: "{{ pop3.message(pop3.address(vars.sid, 1), pop3.address(vars.sid, 2), vars.subject, vars.text, attachment=content.binary(kind='pdf', size=rand_int(vars.attachment_min, vars.attachment_max)), filename='invoice.pdf', content_type='application/pdf') }}" }
      - send: "{{ pop3.retr_reply(last, vars.msg, vars.messages) }}"
      - expect: { pattern: "\r\n", timeout_ms: 5000 }
      - send: "+OK Logging out.\r\n"
      - close: fin
