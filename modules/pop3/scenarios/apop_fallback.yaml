scenario: apop_fallback
description: A mail client on port 110 that tries APOP first and falls back to USER and PASS, as fetchmail does in its automatic mode. The server greeting carries a timestamp banner <pid.clock@host>, and the client computes the MD5 digest of the banner followed by the secret and sends APOP user digest. The server rejects it with -ERR [AUTH], because the account has no password that APOP can use, and the client logs in with USER and PASS in clear text. It then asks for STAT and the full LIST, downloads message 1 with RETR, a dot stuffed MIME message with a PDF attachment, and ends with QUIT. The secret is a synthetic value with the prefix Tst-. nDPI 4.2 identifies POP3 at the PASS command, which a session that logs in with APOP alone never sends, see apop_login.
vars:
  server_port: 110
  server_name: pop3.example.test
  messages: 6
  body_size: 1800
  attachment_min: 24000
  attachment_max: 160000
flows:
  - id: apop_fallback
    module: pop3
    client:
      - connect: { port: "{{ vars.server_port }}" }
      - expect: { pattern: "\r\n", timeout_ms: 5000 }
      - set:
          greeting: "{{ last }}"
          login: "{{ pop3.credential('user') }}"
          secret: "{{ pop3.credential('password') }}"
      - send: "APOP {{ vars.login }} {{ pop3.apop_digest(vars.greeting, vars.secret) }}\r\n"
      - expect: { pattern: "\r\n", timeout_ms: 5000 }
      - send: "USER {{ vars.login }}\r\n"
      - expect: { pattern: "\r\n", timeout_ms: 5000 }
      - send: "PASS {{ vars.secret }}\r\n"
      - expect: { pattern: "\r\n", timeout_ms: 5000 }
      - send: "STAT\r\n"
      - expect: { pattern: "\r\n", timeout_ms: 5000 }
      - send: "LIST\r\n"
      - expect: { pattern: "\r\n.\r\n", timeout_ms: 5000 }
      - send: "RETR 1\r\n"
      - expect: { pattern: "\r\n.\r\n", timeout_ms: 30000 }
      - delay: { dist: exponential, mean_ms: 80 }
      - send: "QUIT\r\n"
      - expect: { pattern: "\r\n", timeout_ms: 5000 }
      - close: fin
    server:
      - accept: { port: "{{ vars.server_port }}" }
      - set: { box: "{{ rand_int(1, 2000000000) }}" }
      - send: "+OK Dovecot ready. {{ pop3.banner(vars.server_name) }}\r\n"
      - expect: { pattern: "\r\n", timeout_ms: 5000 }
      - send: "-ERR [AUTH] Authentication failed.\r\n"
      - expect: { pattern: "\r\n", timeout_ms: 5000 }
      - send: "+OK\r\n"
      - expect: { pattern: "\r\n", timeout_ms: 5000 }
      - send: "+OK Logged in.\r\n"
      - expect: { pattern: "\r\n", timeout_ms: 5000 }
      - send: "{{ pop3.stat_reply(vars.messages, vars.box) }}"
      - expect: { pattern: "\r\n", timeout_ms: 5000 }
      - send: "{{ pop3.list_reply(last, vars.messages, vars.box) }}"
      - expect: { pattern: "\r\n", timeout_ms: 5000 }
      - set: { sid: "{{ rand_int(1, 2000000000) }}" }
      - set:
          subject: "Statement {{ rand_int(1000, 9999) }}"
          text: "{{ content.email(size=vars.body_size) }}"
      - set: { msg: "{{ pop3.message(pop3.address(vars.sid, 1), pop3.address(vars.sid, 2), vars.subject, vars.text, cc=pop3.address(vars.sid, 3), attachment=content.binary(kind='pdf', size=rand_int(vars.attachment_min, vars.attachment_max)), filename='statement.pdf', content_type='application/pdf') }}" }
      - send: "{{ pop3.retr_reply(last, vars.msg, vars.messages) }}"
      - expect: { pattern: "\r\n", timeout_ms: 5000 }
      - send: "+OK Logging out.\r\n"
      - close: fin
