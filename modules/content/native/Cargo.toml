[package]
name = "fps-module-content"
description = "Native template functions of the content module, synthetic content generators (decision D10)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
fps-flow = { path = "../../../engine/fps-flow" }
# RngCore appears in the signature of the TemplateFn trait.
rand = { version = "0.8", default-features = false }

[dev-dependencies]
rand_pcg = "0.3"
serde_json = "1"
# serde_norway is a maintained fork of the deprecated serde_yaml (RUSTSEC-2024-0449).
serde_yaml = { package = "serde_norway", version = "0.9" }

# The module layout keeps tests in modules/content/tests, next to the manifest
# they check, so the targets point one directory up.
[[test]]
name = "catalog"
path = "../tests/catalog.rs"

[[test]]
name = "generators"
path = "../tests/generators.rs"
