scenario: lookup_cname
description: One A query over UDP for a name behind a chain of two CNAME records, which the answer section carries before the address.
vars:
  host: static.example.test
  qtype: A
  server_port: 53
flows:
  - id: query
    module: dns
    l4: udp
    client:
      - connect: { port: "{{ vars.server_port }}" }
      - send: "{{ dns.query(name=vars.host, qtype=vars.qtype) }}"
      - expect: { min_bytes: 12, max_datagram: 512, timeout_ms: 2000 }
      - set: { server_ip: "{{ dns.answer_ip(last) }}" }
      - close: fin
    server:
      - accept: { port: "{{ vars.server_port }}" }
      - expect: { min_bytes: 12, max_datagram: 512, timeout_ms: 2000 }
      - send: "{{ dns.response(last) }}"
      - close: fin
