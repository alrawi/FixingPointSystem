# SPDX-License-Identifier: GPL-3.0-only
# Expected labels of hls.pcapng, which capture.sh records in the QA-01 harness.
# realism/schema/labels.schema.json defines the format.
#
# One TCP port per scenario, so a session maps to its application. vod_ladder
# runs on 8090, the playlist connection of vod_segments on 8091 and its
# segments, one connection each, on 8092, and live_refresh on 8093. nDPI must
# classify at least 99% of these sessions as HTTP from the payload alone.
#
# The temporal section is the acceptance of MOD-15 and says everything that the
# playback check of that package (hls_check.py) said; MOD-31 moved it here.
#
#   arrivals  The segment connections of vod_segments start one segment duration
#             apart, 400 ms in this capture, on an absolute schedule, so the gaps
#             between their starts must all lie within 40 ms of 400 ms.
#   packets   The requests for segments, which the path selects, follow each
#             other 400 ms apart, within 40 ms for 90% of the gaps, with a mean
#             within 20 ms (5%). A keepalive connection also fetches playlists,
#             which the path leaves out. join_ms joins the segment connections
#             of vod_segments, which start less than two segment durations
#             apart, into the one playback that they are. A playback is short,
#             so a target needs 3 gaps and not the 30 of the section.
#   rungs     The body of a segment is within one transport stream packet (188
#             octets) of rate * duration / 8, the share of each rung in the
#             bytes and the bit rate of a playback are within 5% of the ladder,
#             and the playbacks of the vod scenarios walk up the whole ladder.
#             streams is the number of playbacks that the peers ran.
#
# The ladder, the segment duration, and the session counts are in params.json,
# which capture.sh and the peer read, so test_temporal_labels.py checks that
# these labels agree with it.
labels: fps-realism-labels
version: 1
threshold: 0.99
sessions:
  - application: hls_vod
    match: {transport: tcp, server_port: 8090}
  - application: hls_playlist
    match: {transport: tcp, server_port: 8091}
  - application: hls_segment
    match: {transport: tcp, server_port: 8092}
  - application: hls_live
    match: {transport: tcp, server_port: 8093}
applications:
  hls_vod: {ndpi: [HTTP]}
  hls_playlist: {ndpi: [HTTP]}
  hls_segment: {ndpi: [HTTP]}
  hls_live: {ndpi: [HTTP]}
temporal:
  alpha: 0.01
  min_samples: 30
  arrivals:
    applications:
      hls_segment: {dist: constant, ms: 400, tolerance_ms: 40}
  packets:
    applications:
      hls_vod: {direction: client, path: '/v\d+/seg\d+\.ts$', dist: constant, ms: 400, tolerance_ms: 40, within: 0.9, mean_tolerance_ms: 20, min_samples: 3}
      hls_live: {direction: client, path: '/v\d+/seg\d+\.ts$', dist: constant, ms: 400, tolerance_ms: 40, within: 0.9, mean_tolerance_ms: 20, min_samples: 3}
      hls_segment: {direction: client, path: '/v\d+/seg\d+\.ts$', dist: constant, ms: 400, tolerance_ms: 40, within: 0.9, mean_tolerance_ms: 20, min_samples: 3, join_ms: 800}
  rungs:
    applications:
      hls_vod: {path: '/v(\d+)/seg\d+\.ts$', duration_ms: 400, bits_per_second: [160000, 320000, 640000], walk: up, streams: 3, min_samples: 4}
      hls_segment: {path: '/v(\d+)/seg\d+\.ts$', duration_ms: 400, bits_per_second: [160000, 320000, 640000], walk: up, streams: 1, min_samples: 4, join_ms: 800}
      hls_live: {path: '/v(\d+)/seg\d+\.ts$', duration_ms: 400, bits_per_second: [160000, 320000, 640000], streams: 3, min_samples: 4}
