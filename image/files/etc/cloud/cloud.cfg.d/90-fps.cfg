#
# cloud-init defaults of the FixingPointSystem appliance.
#
# A NoCloud seed (a disk labeled cidata, or a seed directory) or a config drive
# carries the user-data of the VM. Without any seed the None datasource applies
# and the defaults below hold. The appliance never ships a password, so a VM
# without a seed has no login. Supply an ssh key through the seed.
datasource_list: [NoCloud, ConfigDrive, None]
datasource:
  None:
    userdata_raw: |
      #cloud-config
      {}

# The image configures its own network files under /etc/systemd/network, because
# the management interface and the test interfaces must not be configured alike.
network:
  config: disabled

preserve_hostname: false
hostname: fps
manage_etc_hosts: localhost
ssh_pwauth: false
disable_root: true

system_info:
  default_user:
    name: fps-admin
    gecos: FixingPointSystem administrator
    groups: [adm, sudo]
    sudo: ["ALL=(ALL) NOPASSWD:ALL"]
    lock_passwd: true
    shell: /bin/bash
