# SPDX-License-Identifier: GPL-3.0-only
# Writes ../reference_merge.json with the merge of engine/fps-stats:
#   cargo run --release --manifest-path controller/internal/metrics/testdata/refgen/Cargo.toml > controller/internal/metrics/testdata/reference_merge.json
[package]
name = "refgen"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
fps-stats = { path = "../../../../../engine/fps-stats" }
hdrhistogram = { version = "7", default-features = false, features = ["serialization"] }
serde_json = "1"
