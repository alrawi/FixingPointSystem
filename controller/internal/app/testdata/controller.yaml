#
# Example controller configuration. Every key is optional, and a missing key keeps
# its default.
listen: 127.0.0.1:8443
log_level: debug
shutdown_timeout: 5s
read_header_timeout: 3s
data_dir: /var/lib/fps
store_path: /var/lib/fps/store/configs.db
grpc_listen: 127.0.0.1:8444
enroll_listen: 127.0.0.1:8445
pki_dir: /var/lib/fps/pki
tls_names: [ctl.lab.example, 10.0.0.5]
admin_socket: /run/fps/admin.sock
agent_auto_enroll: true
tokens:
  - { name: ci, scope: run, token: example-run-token-0123456789 }
  - { name: ops, scope: admin, token_file: /etc/fps/admin.token }
