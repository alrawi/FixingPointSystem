# Pools that do not divide evenly over five workers on two agents, with a
# concurrency objective that does not divide evenly over the mix.
apiVersion: fixingpoint.dev/v1alpha1
kind: Test
metadata:
  name: uneven_pool
topology: app_sim
network:
  ports:
    - { name: client0, location: eth1 }
    - { name: server0, location: eth2 }
  host_pools:
    - { name: clients, port: client0, role: client, ipv4: 16.0.0.0/24, count: 254 }
    - { name: servers, port: server0, role: server, ipv4: 48.0.0.0/24, ipv6: "2001:db8::/120", count: 7 }
profile:
  basis: sessions
  mix:
    - { scenario: http1/web_get, weight: 5 }
    - { scenario: http1/web_browse, weight: 3 }
    - { scenario: dns/lookup, weight: 2 }
load:
  objective: { type: concurrent_sessions, value: 1001 }
  phases:
    - { name: steady, duration_s: 60, shape: hold }
timeline: { seed: 7 }
