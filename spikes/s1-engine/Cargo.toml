[package]
name = "fps-spike-engine"
description = "Phase 0 spike S1: flow program interpreter over kernel sockets"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "fps-spike-engine"
path = "src/main.rs"

[dependencies]
anyhow = "1"
bytes = "1"
clap = { version = "4", features = ["derive"] }
hdrhistogram = { version = "7", default-features = false }
libc = "0.2"
memchr = "2"
rand = { version = "0.8", features = ["small_rng"] }
rand_distr = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# serde_norway is a maintained fork of the deprecated serde_yaml (RUSTSEC-2024-0449).
serde_yaml = { package = "serde_norway", version = "0.9" }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "macros", "sync"] }
