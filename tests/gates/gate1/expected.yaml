#
# Expected labels of the Gate 1 capture. The ports follow the mix of
# test-config.yaml, and realism/schema/labels.schema.json defines the format.
# run.sh passes the gate threshold with --threshold, which overrides the
# threshold below.
labels: fps-realism-labels
version: 1
threshold: 0.99
sessions:
  - application: http1
    match: {transport: tcp, server_port: 80}
  - application: http1
    match: {transport: tcp, server_port: 8080}
  - application: dns
    match: {transport: udp, server_port: 53}
