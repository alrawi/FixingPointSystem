openapi: 3.0.3
info: { title: Fixture API, version: 1.1.0 }
paths:
  /items:
    get:
      operationId: listItems
      parameters:
        - { name: page_size, in: query, schema: { type: integer } }
        - { name: page_token, in: query, schema: { type: string } }
      responses:
        "200":
          description: Items.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Item" } }
                  next_page_token: { type: string }
  /items/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      operationId: getItem
      responses:
        "200":
          description: One item.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Item" }
  /tags:
    get:
      operationId: listTags
      responses:
        "200":
          description: Tags.
          content:
            application/json:
              schema: { type: array, items: { type: string } }
components:
  schemas:
    Item:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
        size: { type: integer }
        color: { type: string }
