# SPDX-License-Identifier: GPL-3.0-only
# Python SDK of the FixingPointSystem controller API. The package needs only the
# standard library. requirements-dev.txt lists the tools for the generator, the
# tests, and the linters.

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "fixingpoint"
version = "0.1.0"
description = "Python client for the FixingPointSystem controller API"
readme = "README.md"
license = "GPL-3.0-only"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools]
packages = ["fixingpoint"]

[tool.setuptools.package-data]
fixingpoint = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["fixingpoint/_generated.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true

[[tool.mypy.overrides]]
module = "fixingpoint._generated"
ignore_errors = true
