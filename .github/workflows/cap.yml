# SPDX-License-Identifier: GPL-3.0-only
#
# Capture session extraction (CAP workstream): ruff, mypy --strict and pytest
# for the capture/ package through make lint-cap test-cap.
name: cap

on:
  push:
    branches: [main]
    paths:
      - capture/**
      - engine/**
      - tests/harness/**
      - contracts/**
      - tools/contracts/**
      - mk/cap.mk
      - Makefile
      - .github/workflows/cap.yml
  pull_request:
    paths:
      - capture/**
      - engine/**
      - tests/harness/**
      - contracts/**
      - tools/contracts/**
      - mk/cap.mk
      - Makefile
      - .github/workflows/cap.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install development tools
        run: python -m pip install -r capture/requirements-dev.txt
      - name: Lint and test
        run: make lint-cap test-cap PYTHON=python

  replay:
    # CAP-02: replays generated scenarios with the real agent in the QA-01
    # namespace harness and compares byte counts within 1 percent.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install the harness tools
        run: sudo apt-get update && sudo apt-get install -y iproute2 tcpdump ethtool
      - name: Install development tools
        run: python -m pip install -r capture/requirements-dev.txt
      - name: Build the agent
        run: cargo build -p fps-agent
      - name: Replay generated scenarios in the namespace harness
        run: >
          sudo env "PATH=$PATH" "RUSTUP_HOME=$RUSTUP_HOME" "CARGO_HOME=$CARGO_HOME"
          FPS_CAP_REPLAY=netns FPS_AGENT="$PWD/target/debug/fps-agent"
          python -m pytest -q capture/tests/test_replay_harness.py
