# SPDX-License-Identifier: GPL-3.0-only
#
# HST kernel port setup under engine/fps-hosts/. The rust job of ci.yml runs the
# fast tests. This workflow runs the integration tests in the QA-01 namespace
# harness as root, which GitHub hosted runners allow through passwordless sudo.
name: hst

on:
  push:
    branches: [main]
    paths:
      - engine/fps-hosts/**
      - tests/harness/**
      - mk/hst.mk
      - .github/workflows/hst.yml
  pull_request:
    paths:
      - engine/fps-hosts/**
      - tests/harness/**
      - mk/hst.mk
      - .github/workflows/hst.yml

permissions:
  contents: read

jobs:
  kernel-port:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install the harness tools
        run: |
          tools/ci/apt-install.sh iproute2 ethtool procps
          sudo modprobe 8021q
      - name: Build the integration tests as the runner user
        run: cargo test -p fps-hosts --test kernel_port --no-run
      - name: Kernel port integration tests as root
        run: |
          sudo env "PATH=$PATH" \
            "RUSTUP_HOME=${RUSTUP_HOME:-$HOME/.rustup}" \
            "CARGO_HOME=${CARGO_HOME:-$HOME/.cargo}" \
            FPS_REQUIRE_VLAN=1 make e2e-hst
      - name: Return the build directory to the runner user for the cache
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" target
