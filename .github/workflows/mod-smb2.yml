# SPDX-License-Identifier: GPL-3.0-only
#
# Workflow of the smb2 module under modules/smb2/. The rust job of ci.yml runs
# the Rust tests of the native crate, but there the tshark test skips itself.
# The tshark job installs tshark and runs it with FPS_REQUIRE_CAPTURE_TOOLS=1,
# so tshark must parse every message that the functions encode (MOD-12
# acceptance). The fuzz job runs the 60 s fuzz test.
name: mod-smb2

on:
  push:
    branches: [main]
    paths:
      - modules/smb2/**
      - engine/fps-flow/**
      - Cargo.lock
      - realism/**
      - tools/contracts/**
      - contracts/schemas/**
      - mk/mod-smb2.mk
      - .github/workflows/mod-smb2.yml
  pull_request:
    paths:
      - modules/smb2/**
      - engine/fps-flow/**
      - Cargo.lock
      - realism/**
      - tools/contracts/**
      - contracts/schemas/**
      - mk/mod-smb2.mk
      - .github/workflows/mod-smb2.yml

permissions:
  contents: read

env:
  GOWORK: "off"

jobs:
  module:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install nDPI, tshark, and Zeek, which the checks call out of process
        run: realism/ci/install-tools.sh
      - run: python -m pip install -r tools/contracts/requirements.txt
      - run: make lint-mod-smb2 PYTHON=python
      - name: Score the committed fixture
        run: |
          python -m realism score --pcap modules/smb2/fixtures/smb2.pcapng \
            --labels modules/smb2/fixtures/expected.yaml --parsers tshark,zeek --output report.json
          python -c 'import json; r = json.load(open("report.json")); print(json.dumps([c.get("applications", c["check"]) for c in r["checks"]], indent=2))'
  tshark:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install tshark
        run: |
          echo "wireshark-common wireshark-common/install-setuid boolean false" | sudo debconf-set-selections
          tools/ci/apt-install.sh tshark
      - name: Parse every encoded message with tshark
        env:
          FPS_REQUIRE_CAPTURE_TOOLS: "1"
        run: cargo test -p fps-module-smb2 --test tshark -- --nocapture
  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Fuzz the readers and the functions for 60 seconds
        run: cargo test -p fps-module-smb2 --release --test fuzz -- --ignored fuzz_60s --nocapture
