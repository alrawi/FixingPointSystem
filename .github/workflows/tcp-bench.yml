name: tcp-bench

# Runs tcp_bench on a hosted runner: the scale row of the own stack, alternating a
# branch with main, and the loss workload of TRN-22 on three stacks, so a package can read an absolute number on a quieter host than the
# agent sandbox. Dispatch only; it reports in the job log and the step summary.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or commit to measure against main
        required: true
      args:
        description: Extra tcp_bench arguments for the branch build
        required: false
        default: "--own-pool 20000"
      pairs:
        description: Alternating pairs of runs
        required: false
        default: "3"
      job:
        description: Which job to run
        required: false
        default: scale
        type: choice
        options: [scale, loss, both]

permissions:
  contents: read

concurrency:
  group: tcp-bench
  cancel-in-progress: false

jobs:
  scale:
    if: inputs.job == 'scale' || inputs.job == 'both'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          path: base
      - name: Check out the branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          path: branch
      - name: Build both binaries
        run: |
          set -euo pipefail
          for d in base branch; do
            (cd "$d" && cargo build --release -p fps-tcp --example tcp_bench)
          done
      - name: Run alternating pairs
        env:
          ARGS: ${{ inputs.args }}
          PAIRS: ${{ inputs.pairs }}
        run: |
          set -euo pipefail
          ulimit -n 1048576 || true
          nproc; grep -m1 'model name' /proc/cpuinfo; free -g | head -2
          common=(--stack own --profile full --workload scale --shards 64 --out -)
          row() { tail -15; }
          read -r -a extra <<< "$ARGS"
          for i in $(seq 1 "$PAIRS"); do
            echo "== pair $i: branch ($ARGS)"
            branch/target/release/examples/tcp_bench "${common[@]}" "${extra[@]}" --label "branch $i" | tee "branch-$i.txt" | row
            echo "== pair $i: main"
            base/target/release/examples/tcp_bench "${common[@]}" --label "main $i" | tee "main-$i.txt" | row
          done
          { echo '## tcp_bench scale row'; for f in branch-*.txt main-*.txt; do echo "### $f"; echo '```'; row < "$f"; echo '```'; done; } >> "$GITHUB_STEP_SUMMARY"

  loss:
    if: inputs.job == 'loss' || inputs.job == 'both'
    # Loss workload of TRN-22 on one host: kernel over netem in network namespaces,
    # and the own and smoltcp stacks over the in-memory impaired link.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out the branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - name: Install netem and namespace tools
        run: |
          set -euo pipefail
          tools/ci/apt-install.sh iproute2
          uname -r
          # The cloud kernels of the hosted image may ship sch_netem in their base
          # modules; the extra modules package exists only for some kernels.
          if ! sudo modprobe sch_netem; then
            tools/ci/apt-install.sh "linux-modules-extra-$(uname -r)" || echo "no linux-modules-extra package for $(uname -r)"
            sudo modprobe sch_netem
          fi
          lsmod | grep -E '^sch_netem'
      - name: Build tcp_bench
        run: cargo build --release -p fps-tcp --example tcp_bench
      - name: Run the loss workload on three stacks
        env:
          FPS_REQUIRE_NETEM: "1"
        run: |
          set -euo pipefail
          nproc; grep -m1 'model name' /proc/cpuinfo
          for s in kernel own smoltcp; do
            echo "== $s"
            target/release/examples/tcp_bench --stack "$s" --workload loss --label "hosted runner $s" --out - | tee "loss-$s.txt" | tail -40
          done
          { echo '## tcp_bench loss workload'; for s in kernel own smoltcp; do echo "### $s"; echo '```'; tail -40 "loss-$s.txt"; echo '```'; done; } >> "$GITHUB_STEP_SUMMARY"
