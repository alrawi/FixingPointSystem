# SPDX-License-Identifier: GPL-3.0-only
#
# Workstream workflow for QA. It follows the one workflow per workstream pattern
# that docs/wiki/Testing.md describes, and it runs the same make targets that an
# agent runs locally.
name: qa

on:
  push:
    branches: [main]
    paths:
      - tests/golden/**
      - .github/**
      - Cargo.toml
      - Cargo.lock
      - Makefile
      - go.work
  pull_request:
    paths:
      - tests/golden/**
      - .github/**
      - Cargo.toml
      - Cargo.lock
      - Makefile
      - go.work

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.5.0
          install-only: true
      - run: python -m pip install -r tests/golden/python/requirements.txt
      - run: make lint-qa test-qa
