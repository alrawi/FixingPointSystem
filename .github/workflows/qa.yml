# SPDX-License-Identifier: GPL-3.0-only
#
# Workstream workflow for QA. It follows the one workflow per workstream pattern
# that docs/wiki/Testing.md describes, and it runs the same make targets that an
# agent runs locally. The harness job runs the namespace harness self test as
# root, which GitHub hosted runners allow through passwordless sudo.
name: qa

on:
  push:
    branches: [main]
    paths:
      - .github/**
      - tests/harness/**
      - Cargo.toml
      - Cargo.lock
      - Makefile
      - go.work
  pull_request:
    paths:
      - .github/**
      - tests/harness/**
      - Cargo.toml
      - Cargo.lock
      - Makefile
      - go.work

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r tests/harness/requirements.txt
      - run: make lint-qa test-qa

  harness:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install the harness tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends iproute2 tcpdump ethtool curl
          sudo modprobe 8021q
      - name: Namespace harness self test
        run: sudo env FPS_REQUIRE_VLAN=1 make e2e-qa
