# SPDX-License-Identifier: GPL-3.0-only
#
# Workstream workflow for OPS. It follows the one workflow per workstream pattern
# that docs/wiki/Testing.md describes, and it runs the same make targets that an
# agent runs locally.
name: ops

on:
  push:
    branches: [main]
    paths:
      - .github/**
      - tools/plan/**
      - tools/swarm/**
      - plan/**
      - docs/wiki/**
      - Cargo.toml
      - Cargo.lock
      - Makefile
      - mk/**
      - CODEOWNERS
  pull_request:
    paths:
      - .github/**
      - tools/plan/**
      - tools/swarm/**
      - plan/**
      - docs/wiki/**
      - Cargo.toml
      - Cargo.lock
      - Makefile
      - mk/**
      - CODEOWNERS

permissions:
  contents: read

env:
  GOWORK: "off"

jobs:
  ops:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false
      - run: python -m pip install -r tools/contracts/requirements.txt
      - run: make lint-ops test-ops
