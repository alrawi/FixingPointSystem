# SPDX-License-Identifier: GPL-3.0-only
#
# Workflow of the pop3 module under modules/pop3/. The rust job of ci.yml runs
# its Rust tests. The module job validates the manifest and scenarios and
# scores the committed fixture with nDPI, tshark, and Zeek, so nDPI must
# classify at least 99% of its sessions as POP3 and no parser reports an error.
# The realism workflow records a fresh capture of the module in the QA-01
# namespace harness and scores it the same way. The job runs on a GitHub hosted
# runner, never on a self hosted one.
name: mod-pop3

on:
  push:
    branches: [main]
    paths:
      - modules/pop3/**
      - modules/content/manifest.yaml
      - realism/**
      - tools/contracts/**
      - contracts/schemas/**
      - mk/mod-pop3.mk
      - .github/workflows/mod-pop3.yml
  pull_request:
    paths:
      - modules/pop3/**
      - modules/content/manifest.yaml
      - realism/**
      - tools/contracts/**
      - contracts/schemas/**
      - mk/mod-pop3.mk
      - .github/workflows/mod-pop3.yml

permissions:
  contents: read

env:
  GOWORK: "off"

jobs:
  module:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install nDPI, tshark, and Zeek, which the checks call out of process
        run: realism/ci/install-tools.sh
      - run: python -m pip install -r tools/contracts/requirements.txt
      - run: make lint-mod-pop3 PYTHON=python
      - name: Score the committed fixture
        run: |
          python -m realism score --pcap modules/pop3/fixtures/pop3.pcapng \
            --labels modules/pop3/fixtures/expected.yaml --parsers tshark,zeek --output report.json
          python -c 'import json; r = json.load(open("report.json")); print(json.dumps([c.get("applications", c["check"]) for c in r["checks"]], indent=2))'
