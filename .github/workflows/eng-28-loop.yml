# SPDX-License-Identifier: GPL-3.0-only
#
# TEMPORARY loop of ENG-28. It runs the two flaky tests of
# engine/fps-runtime/tests/instances.rs 200 times on the hosted runner, and the
# whole test binary 200 times as the rust job of ci.yml runs it. The package
# deletes this file before review. It runs only for changes to this file.
name: eng-28-loop

on:
  pull_request:
    paths:
      - .github/workflows/eng-28-loop.yml

permissions:
  contents: read

jobs:
  loop:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the test binary
        run: |
          cargo test -p fps-runtime --test instances --no-run --message-format=json \
            | jq -r 'select(.executable != null and .target.name == "instances") | .executable' > bin.txt
          cat bin.txt
          test "$(wc -l < bin.txt)" = 1
      - name: Both tests, 200 runs
        run: |
          bin=$(cat bin.txt)
          fail=0
          for i in $(seq 1 200); do
            if ! "$bin" mixed_session_runs_with_one_data_connection_per_transfer \
                 concurrent_instances_that_draw_the_same_data_port_all_succeed > run.log 2>&1; then
              fail=$((fail + 1))
              echo "::group::run $i failed"
              cat run.log
              echo "::endgroup::"
            fi
          done
          echo "both tests: 200 runs, $fail failures"
          test "$fail" = 0
      - name: The whole instances binary, 200 runs
        run: |
          bin=$(cat bin.txt)
          fail=0
          for i in $(seq 1 200); do
            if ! "$bin" > run.log 2>&1; then
              fail=$((fail + 1))
              echo "::group::run $i failed"
              cat run.log
              echo "::endgroup::"
            fi
          done
          echo "whole binary: 200 runs, $fail failures"
          test "$fail" = 0
