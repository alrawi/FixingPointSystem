# SPDX-License-Identifier: GPL-3.0-only
#
# TEMPORARY, CTL-36 only. Removed before the package goes to review. It runs
# TestDownloadResumesAfterAnInterruptedUpload 200 times with the race detector
# under CPU load, first with the fake agent of main (sleep and cancel break)
# and then with the fixed one (half close break).
name: tmp-ctl-36-stress

on:
  pull_request:
    paths:
      - .github/workflows/tmp-ctl-36-stress.yml

permissions:
  contents: read

env:
  GOWORK: "off"

jobs:
  stress:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: controller
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: controller/go.mod
          cache-dependency-path: controller/go.sum
      - name: build the tests once
        run: go test -race -c -o /tmp/captures.test ./internal/captures/
      - name: load the CPUs
        run: |
          for i in $(seq 1 $(( $(nproc) * 2 ))); do (while :; do :; done) & done
          echo "started $(( $(nproc) * 2 )) busy loops"
      - name: old fake agent (expected to flake)
        continue-on-error: true
        run: |
          git show origin/main:controller/internal/fakeagent/capture.go > internal/fakeagent/capture.go
          go test -race -c -o /tmp/captures-old.test ./internal/captures/
          git checkout HEAD -- internal/fakeagent/capture.go
          cd internal/captures
          /tmp/captures-old.test -test.run 'TestDownloadResumesAfterAnInterruptedUpload' -test.count=200 2>&1 | tee /tmp/old.log | tail -30
          echo "old fake agent: $(grep -c -- '--- FAIL' /tmp/old.log) failures in 200 runs"
      - name: fixed fake agent (must pass)
        run: |
          git diff --stat HEAD -- internal/fakeagent || true
          cd internal/captures
          /tmp/captures.test -test.run 'TestDownloadResumesAfterAnInterruptedUpload' -test.count=200
      - name: fixed fake agent, whole package, with the race detector
        run: |
          cd internal/captures
          /tmp/captures.test -test.count=20
