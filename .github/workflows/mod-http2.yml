# SPDX-License-Identifier: GPL-3.0-only
#
# Workflow of the http2 module under modules/http2/. The rust job of ci.yml runs
# its Rust tests. The module job validates the manifest and scenarios and scores
# the committed fixture with nDPI and tshark. The harness job records a fresh
# capture in the QA-01 namespace harness over kernel sockets and scores it. The
# fuzz job runs the 60 s fuzz test of the frame and HPACK parsers.
#
# nDPI 4.2.0, the libndpi-bin of ubuntu-24.04, has no HTTP/2 protocol and reports
# every cleartext HTTP/2 session as Unknown. The jobs that score a capture
# therefore install their tools with realism/ci/install-tools.sh, which builds
# the pinned nDPI 4.14 of realism/ci/ndpi.version and puts its ndpiReader first
# on the search path. The realism runner reads its flow file directly.
# All jobs run on GitHub-hosted runners.
name: mod-http2

on:
  push:
    branches: [main]
    paths:
      - modules/http2/**
      - modules/tls/**
      - engine/**
      - realism/**
      - tests/harness/**
      - tools/contracts/**
      - contracts/schemas/**
      - mk/mod-http2.mk
      - .github/workflows/mod-http2.yml
  pull_request:
    paths:
      - modules/http2/**
      - modules/tls/**
      - engine/**
      - realism/**
      - tests/harness/**
      - tools/contracts/**
      - contracts/schemas/**
      - mk/mod-http2.mk
      - .github/workflows/mod-http2.yml

permissions:
  contents: read

env:
  GOWORK: "off"

jobs:
  module:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tshark, Zeek, and the pinned nDPI, which the checks call out of process
        run: realism/ci/install-tools.sh
      - run: python -m pip install -r tools/contracts/requirements.txt
      - run: make lint-mod-http2 PYTHON=python
      - name: Score the committed fixture
        run: |
          python -m realism score --pcap modules/http2/fixtures/http2.pcapng \
            --labels modules/http2/fixtures/expected.yaml --parsers tshark --output report.json
          python -c 'import json; r = json.load(open("report.json")); print(json.dumps([c.get("applications", c["check"]) for c in r["checks"]], indent=2))'
      - name: Check the decrypted HTTPS sessions of the committed fixture
        run: |
          python -m realism decrypted --pcap modules/http2/fixtures/http2.pcapng \
            --labels realism/examples/decrypted/http2.labels.yaml --sessions 40 --parsers tshark

  harness:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install the harness tools, tshark, Zeek, and the pinned nDPI
        run: realism/ci/install-tools.sh
      - run: cargo build -p fps-module-http2 --example fixture_peer
      - name: Record and score a fresh capture in the namespace harness
        run: |
          sudo env FPS_FIXTURE_PEER="$PWD/target/debug/examples/fixture_peer" \
            modules/http2/fixtures/capture.sh "$RUNNER_TEMP/fixture"
          python3 -c 'import json, sys; r = json.load(open(sys.argv[1])); print(json.dumps([c.get("applications", c["check"]) for c in r["checks"]], indent=2))' \
            "$RUNNER_TEMP/fixture/http2.report.json"

  fuzz-60s:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Fuzz the frame and HPACK parsers for 60 seconds
        run: cargo test -p fps-module-http2 --release --test fuzz -- --ignored fuzz_60s --nocapture
