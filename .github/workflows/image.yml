# SPDX-License-Identifier: GPL-3.0-only
#
# Image boot test of IMG-04. The job builds the controller and the static musl agent
# and the appliance image with Packer and QEMU (image/build.sh), boots the all-in-one
# role (image/boot-test.sh --run), runs the checks of the boot test, and then a short
# HTTP and DNS run inside the VM through the controller REST API with the agent of the
# image over mutual TLS (image/tests/vm-run.sh). The boot log, the check results, and
# the run report are workflow artifacts, and the job summary shows the result.
#
# KVM: GitHub hosted Linux runners expose /dev/kvm. A udev rule gives the runner user
# access. When the device is missing or unusable, the job falls back to software
# emulation (TCG) with longer timeouts and a lower rate. A manual run can force TCG.
#
# Security rules, which docs/wiki/Operations.md repeats:
#   - The job runs on a GitHub hosted runner only. This public repository never lets a
#     workflow reach the self hosted fps-bench runner or any other self hosted label.
#   - The token is read only, and the workflow uses no secrets.
#   - Branch names and other event text never reach a script through ${{ }}. The inputs
#     arrive through env.
name: image

on:
  push:
    branches: [main]
    paths:
      - image/**
      - engine/**
      - controller/**
      - modules/http1/**
      - modules/dns/**
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/image.yml
  pull_request:
    paths:
      - image/**
      - engine/**
      - controller/**
      - modules/http1/**
      - modules/dns/**
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/image.yml
  workflow_dispatch:
    inputs:
      force_tcg:
        description: "Use software emulation even when /dev/kvm works (tests the fallback, slow)."
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  # rust-cache caches target/ of the workspace, and build.sh builds the agent there.
  CARGO_TARGET_DIR: ${{ github.workspace }}/target

jobs:
  boot:
    name: Build, boot, and run
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Choose the accelerator
        id: accel
        env:
          FORCE_TCG: ${{ inputs.force_tcg }}
        run: |
          set -euo pipefail
          accel=tcg
          if [ -e /dev/kvm ]; then
            # The standard rule that gives every user access to KVM on a hosted runner.
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
              sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
            sleep 1
            ls -l /dev/kvm
            if [ -w /dev/kvm ]; then accel=kvm; fi
          else
            echo "/dev/kvm does not exist on this runner"
          fi
          if [ "$FORCE_TCG" = true ]; then
            echo "force_tcg is set"
            accel=tcg
          fi
          echo "accel=$accel" >> "$GITHUB_OUTPUT"
          echo "accelerator: $accel"
          nproc
          free -m
          df -h /

      - name: Install the host packages
        run: |
          set -euo pipefail
          tools/ci/apt-install.sh \
            qemu-system-x86 qemu-utils cloud-image-utils xorriso \
            curl openssh-client openssl python3 file musl-tools

      - name: Install Packer
        run: |
          set -euo pipefail
          if command -v packer >/dev/null 2>&1; then
            packer version
            exit 0
          fi
          curl -fsSL https://apt.releases.hashicorp.com/gpg |
            sudo gpg --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" |
            sudo tee /etc/apt/sources.list.d/hashicorp.list >/dev/null
          tools/ci/apt-install.sh --install-recommends packer
          packer version

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
        with:
          key: image-musl
      - uses: actions/setup-go@v5
        with:
          go-version-file: controller/go.mod
          cache-dependency-path: controller/go.sum

      # The base image is cached by its checksum, so a new Ubuntu release builds a
      # new cache entry and a pinned checksum guards the download.
      - name: Find the checksum of the Ubuntu cloud image
        id: base
        run: |
          set -euo pipefail
          sums="$(curl -fsSL https://cloud-images.ubuntu.com/releases/noble/release/SHA256SUMS)"
          sha="$(printf '%s\n' "$sums" | awk '$2 ~ /^\*?ubuntu-24\.04-server-cloudimg-amd64\.img$/ { print $1; exit }')"
          if ! printf '%s' "$sha" | grep -Eq '^[0-9a-f]{64}$'; then
            echo "::error::SHA256SUMS has no checksum for the amd64 cloud image"
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "cloud image sha256 $sha"
      - uses: actions/cache@v4
        with:
          path: image/.cache/packer
          key: ubuntu-cloudimg-${{ steps.base.outputs.sha }}
      - uses: actions/cache@v4
        with:
          path: image/.cache/packer-plugins
          key: packer-plugins-${{ hashFiles('image/fps.pkr.hcl') }}

      - name: Build the image
        env:
          ACCEL: ${{ steps.accel.outputs.accel }}
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          set -euo pipefail
          mkdir -p boot-out
          export FPS_ACCEL="$ACCEL"
          export FPS_BASE_IMAGE_CHECKSUM="sha256:$BASE_SHA"
          if [ "$ACCEL" = tcg ]; then
            export FPS_ALLOW_TCG=1
            export FPS_SSH_TIMEOUT=60m
          fi
          start=$SECONDS
          image/build.sh 2>&1 | tee boot-out/build.log
          echo "image build took $((SECONDS - start)) s with $ACCEL"
          ls -l image/output

      - name: Boot the all-in-one role and run HTTP and DNS
        env:
          ACCEL: ${{ steps.accel.outputs.accel }}
          FPS_TEST_ARTIFACT_DIR: boot-out
          # IMG-07: three boots in a row and a boot with an unreachable controller
          # on pull requests, one boot on main.
          FPS_TEST_REPEAT: ${{ github.event_name == 'pull_request' && '3' || '1' }}
          FPS_TEST_NEGATIVE: ${{ github.event_name == 'pull_request' && 'agent-unreachable' || '' }}
        run: |
          set -euo pipefail
          if [ "$ACCEL" = tcg ]; then
            export FPS_ALLOW_TCG=1
            # The script multiplies the boot wait by 4 under software emulation.
            export FPS_TEST_BOOT_WAIT=600
            export FPS_RUN_RATE=10
            export FPS_RUN_STEADY_S=10
            export FPS_RUN_WAIT_S=600
          fi
          start=$SECONDS
          image/boot-test.sh --role all-in-one --run image/output/fps-base.qcow2 2>&1 | tee boot-out/boot-test.log
          echo "boot test took $((SECONDS - start)) s with $ACCEL"

      - name: Job summary
        if: always()
        env:
          ACCEL: ${{ steps.accel.outputs.accel }}
        run: |
          image/ci-summary.sh "$ACCEL" boot-out/boot-test.log boot-out >> "$GITHUB_STEP_SUMMARY" || true
          if [ -f image/output/fps-base.qcow2.sha256 ]; then
            cp image/output/fps-base.qcow2.sha256 boot-out/
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: image-boot-test
          path: boot-out/
          if-no-files-found: warn
          retention-days: 14
