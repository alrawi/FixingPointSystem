# SPDX-License-Identifier: GPL-3.0-only
#
# Workstream workflow for RLM. It runs the same make targets that an agent runs
# locally, installs nDPI, tshark, and Zeek so that the optional tests of the real
# tools run, and scores a synthetic capture with the installed runner under
# python -I. realism/ci/install-tools.sh installs the tools. It takes Zeek from
# the package repository of the Zeek project, because Ubuntu does not ship it,
# and pins the version in realism/ci/zeek.version for this workflow and for the
# realism workflow alike.
name: rlm

on:
  push:
    branches: [main]
    paths:
      - realism/**
      - contracts/metrics/catalog.yaml
      - .github/**
      - Cargo.toml
      - Cargo.lock
      - Makefile
      - mk/rlm.mk
  pull_request:
    paths:
      - realism/**
      - contracts/metrics/catalog.yaml
      - .github/**
      - Cargo.toml
      - Cargo.lock
      - Makefile
      - mk/rlm.mk

permissions:
  contents: read

env:
  GOWORK: "off"

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install nDPI, tshark, and the pinned Zeek, which the runner calls out of process
        run: |
          realism/ci/install-tools.sh
          echo /opt/zeek/bin >> "$GITHUB_PATH"
      - run: python -m pip install -r realism/requirements-dev.txt
      - run: make lint-rlm test-rlm PYTHON=python
      - name: Score a synthetic capture with the installed runner
        run: |
          python -m pip install ./realism
          tmp="$(mktemp -d)"
          python -c 'import sys; from pathlib import Path; from realism.tests.pcapgen import mixed_capture; mixed_capture(5, 5).write_pcapng(Path(sys.argv[1]))' "$tmp/mix.pcapng"
          cp realism/examples/http-dns.labels.yaml "$tmp/labels.yaml"
          cd "$tmp"
          python -I -m realism score --pcap mix.pcapng --labels labels.yaml --parsers tshark,zeek --output report.json
          python -c 'import json; r = json.load(open("report.json")); print(json.dumps([c.get("applications", c["check"]) for c in r["checks"]], indent=2))'
