# SPDX-License-Identifier: GPL-3.0-only
#
# Workstream workflow for RLM. It runs the same make targets that an agent runs
# locally, installs nDPI so that the optional ndpiReader test runs, and scores a
# synthetic capture with the installed runner under python -I.
name: rlm

on:
  push:
    branches: [main]
    paths:
      - realism/**
      - contracts/metrics/catalog.yaml
      - .github/**
      - Cargo.toml
      - Cargo.lock
      - Makefile
      - go.work
  pull_request:
    paths:
      - realism/**
      - contracts/metrics/catalog.yaml
      - .github/**
      - Cargo.toml
      - Cargo.lock
      - Makefile
      - go.work

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install nDPI, which the runner calls out of process
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libndpi-bin
          ndpiReader -h | head -1
      - run: python -m pip install -r realism/requirements-dev.txt
      - run: make lint-rlm test-rlm PYTHON=python
      - name: Score a synthetic capture with the installed runner
        run: |
          python -m pip install ./realism
          tmp="$(mktemp -d)"
          python -c 'import sys; from pathlib import Path; from realism.tests.pcapgen import mixed_capture; mixed_capture(5, 5).write_pcapng(Path(sys.argv[1]))' "$tmp/mix.pcapng"
          cp realism/examples/http-dns.labels.yaml "$tmp/labels.yaml"
          cd "$tmp"
          python -I -m realism score --pcap mix.pcapng --labels labels.yaml --output report.json
          python -c 'import json; r = json.load(open("report.json")); print(json.dumps(r["checks"][0]["applications"], indent=2))'
