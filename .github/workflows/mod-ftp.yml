# SPDX-License-Identifier: GPL-3.0-only
#
# Workflow of the ftp module under modules/ftp/. The rust job of ci.yml runs
# its Rust tests. The module job validates the manifest and scenarios, checks
# the session structure of the committed fixture with the CAP-01 extractor (one
# control connection per FTP session and one data connection per transfer),
# and scores the fixture with nDPI, tshark, and Zeek, so nDPI must classify at
# least 99% of its control connections as FTP_CONTROL, no parser reports an
# error, and ftp.log and files.log hold every RETR and STOR.
# The realism workflow records a fresh capture of the module in the QA-01
# namespace harness and checks it the same way. The job runs on a GitHub hosted
# runner, never on a self hosted one.
name: mod-ftp

on:
  push:
    branches: [main]
    paths:
      - modules/ftp/**
      - modules/content/manifest.yaml
      - realism/**
      - capture/**
      - tools/contracts/**
      - contracts/schemas/**
      - mk/mod-ftp.mk
      - .github/workflows/mod-ftp.yml
  pull_request:
    paths:
      - modules/ftp/**
      - modules/content/manifest.yaml
      - realism/**
      - capture/**
      - tools/contracts/**
      - contracts/schemas/**
      - mk/mod-ftp.mk
      - .github/workflows/mod-ftp.yml

permissions:
  contents: read

env:
  GOWORK: "off"

jobs:
  module:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install nDPI, tshark, and Zeek, which the checks call out of process
        run: realism/ci/install-tools.sh
      - run: python -m pip install -r tools/contracts/requirements.txt
      - run: make lint-mod-ftp PYTHON=python
      - name: Unit tests of the fixture checks
        run: PYTHONDONTWRITEBYTECODE=1 python -m unittest discover -s modules/ftp/fixtures
      - name: Check the session structure of the committed fixture
        run: |
          python modules/ftp/fixtures/structure_check.py modules/ftp/fixtures/ftp.pcapng \
            --controls 40 --transfers 80
      - name: Score the committed fixture
        run: |
          python -m realism score --pcap modules/ftp/fixtures/ftp.pcapng \
            --labels modules/ftp/fixtures/expected.yaml --parsers tshark,zeek --output report.json
          python -c 'import json; r = json.load(open("report.json")); print(json.dumps([c.get("applications", c["check"]) for c in r["checks"]], indent=2))'
      - name: Check ftp.log and files.log of the committed fixture
        run: |
          python modules/ftp/fixtures/zeek_check.py modules/ftp/fixtures/ftp.pcapng \
            --transfers 80 --file-transfers 64
