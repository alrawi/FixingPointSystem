# SPDX-License-Identifier: GPL-3.0-only
#
# TRN transport backends. The capture job runs the OS profile capture test on
# the QA-01 namespace harness as root, which GitHub hosted runners allow
# through passwordless sudo. The Rust tests of the backend run in ci.yml. The
# afxdp job runs the AF_XDP veth test of TRN-11 with FPS_REQUIRE_AFXDP=1, so it
# fails instead of skipping where AF_XDP cannot run, and the dns scenarios over
# the user space datapath (TRN-29). The interop job runs the own stack against
# smoltcp and the kernel (TRN-26).
name: trn

on:
  push:
    branches: [main]
    paths:
      - engine/fps-backend-kernel/**
      - engine/fps-backend-afxdp/**
      - engine/fps-agent/**
      - engine/fps-datapath/**
      - engine/fps-tcp/**
      - engine/fps-tcp-own/**
      - engine/fps-udp-own/**
      - modules/dns/**
      - tests/harness/**
      - realism/**
      - mk/trn.mk
      - tools/ci/own-profiles.sh
      - .github/workflows/trn.yml
      - Cargo.toml
      - Cargo.lock
  pull_request:
    paths:
      - engine/fps-backend-kernel/**
      - engine/fps-backend-afxdp/**
      - engine/fps-agent/**
      - engine/fps-datapath/**
      - engine/fps-tcp/**
      - engine/fps-tcp-own/**
      - engine/fps-udp-own/**
      - modules/dns/**
      - tests/harness/**
      - realism/**
      - mk/trn.mk
      - tools/ci/own-profiles.sh
      - .github/workflows/trn.yml
      - Cargo.toml
      - Cargo.lock

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r tests/harness/requirements.txt
      - run: make lint-trn test-trn

  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install the harness tools
        run: tools/ci/apt-install.sh iproute2 tcpdump ethtool libndpi-bin python3-yaml
      - name: Build the probe
        run: make build-trn-probe
      - name: OS profile capture test
        run: sudo env FPS_KEEP_CAPTURES="$RUNNER_TEMP/captures" make e2e-trn
      - name: Keep the captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trn-profile-captures
          path: ${{ runner.temp }}/captures
          if-no-files-found: ignore

  own-profiles:
    # The OS profiles of the own stack (TRN-28), scored by the realism runner
    # like the kernel captures of the capture job, with a negative control.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install the scoring tools
        run: tools/ci/apt-install.sh libndpi-bin python3-yaml
      - name: Score the own stack captures
        run: tools/ci/own-profiles.sh "$RUNNER_TEMP/own-profiles"
      - name: Keep the captures and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: own-stack-profiles
          path: ${{ runner.temp }}/own-profiles
          if-no-files-found: ignore

  afxdp:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: AF_XDP veth test
        run: cargo test -p fps-backend-afxdp -- --nocapture
        env:
          FPS_REQUIRE_AFXDP: "1"
          FPS_DATAPATH_RESULTS: ${{ runner.temp }}/datapath
      - name: Next hop resolution behind a router
        run: cargo test -p fps-datapath --test router -- --nocapture
        env:
          FPS_REQUIRE_AFXDP: "1"
          FPS_ROUTER_RESULTS: ${{ runner.temp }}/datapath
      - name: AF_XDP backend of the agent
        run: cargo test -p fps-agent --test afxdp_veth -- --nocapture
        env:
          FPS_REQUIRE_AFXDP: "1"
      - name: dns scenarios over the user space datapath
        run: cargo test -p fps-datapath --test dns_scenarios -- --nocapture
        env:
          FPS_REQUIRE_AFXDP: "1"
          FPS_DNS_RESULTS: ${{ runner.temp }}/datapath
      - name: Keep the datapath numbers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: datapath-results
          path: ${{ runner.temp }}/datapath
          if-no-files-found: ignore

  interop:
    # The own stack against smoltcp and the kernel (TRN-26), with netem for the loss rows.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install iproute2 and the netem module
        run: |
          set -euo pipefail
          tools/ci/apt-install.sh iproute2
          if ! sudo modprobe sch_netem; then
            tools/ci/apt-install.sh "linux-modules-extra-$(uname -r)"
            sudo modprobe sch_netem
          fi
      - name: Own stack against smoltcp and the kernel
        run: cargo test -p fps-tcp --test interop_smol --test interop_kernel -- --nocapture
        env:
          FPS_REQUIRE_AFXDP: "1"
          FPS_REQUIRE_NETEM: "1"
          FPS_INTEROP_RESULTS: ${{ runner.temp }}/interop
      - name: Keep the interop numbers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: interop-results
          path: ${{ runner.temp }}/interop
          if-no-files-found: ignore
