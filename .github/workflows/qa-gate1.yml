# SPDX-License-Identifier: GPL-3.0-only
#
# QA Gate 1 acceptance suite under tests/gates/gate1/. The gate job builds the
# agent and the controller as the runner user, installs nDPI, tshark, and Zeek
# with realism/ci/install-tools.sh, runs the suite as root, which GitHub hosted
# runners allow through passwordless sudo, and then proves that a threshold
# above the measured ratios fails the gate. The gate report lands in the job
# summary and in the gate1-report artifact.
name: qa-gate1

on:
  push:
    branches: [main]
    paths:
      - tests/gates/gate1/**
      - tests/harness/**
      - engine/**
      - modules/**
      - controller/**
      - realism/**
      - contracts/**
      - Cargo.lock
      - mk/qa-gate1.mk
      - .github/workflows/qa-gate1.yml
  pull_request:
    paths:
      - tests/gates/gate1/**
      - tests/harness/**
      - engine/**
      - modules/**
      - controller/**
      - realism/**
      - contracts/**
      - Cargo.lock
      - mk/qa-gate1.mk
      - .github/workflows/qa-gate1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r tests/harness/requirements.txt
      - run: make lint-qa-gate1 test-qa-gate1 PYTHON=python

  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-go@v5
        with:
          go-version-file: controller/go.mod
          cache-dependency-path: controller/go.sum
      - name: Install the harness and realism tools
        run: |
          realism/ci/install-tools.sh
          sudo apt-get install -y -q --no-install-recommends curl
      - name: Build the agent and the controller as the runner user
        run: make build-qa-gate1 GO=go
      - name: Gate 1 suite and negative proof as root
        run: sudo env "PATH=/opt/zeek/bin:$PATH" make e2e-qa-gate1 QA_GATE1_OUT=gate1-out
      - name: Gate report in the job summary
        if: always()
        run: |
          if [ -f gate1-out/report.md ]; then
            cat gate1-out/report.md >> "$GITHUB_STEP_SUMMARY"
          fi
          sudo chown -R "$(id -u):$(id -g)" target gate1-out 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gate1-report
          path: |
            gate1-out/*.md
            gate1-out/*.json
            gate1-out/*.csv
            gate1-out/*.log
            gate1-out/raised/*.md
            gate1-out/raised/*.json
          if-no-files-found: warn
