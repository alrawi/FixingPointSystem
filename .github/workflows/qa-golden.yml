# SPDX-License-Identifier: GPL-3.0-only
#
# QA golden file helpers under tests/golden/. One workflow file per workstream
# area, named after the area, so parallel packages never create the same file.
name: qa-golden

on:
  push:
    branches: [main]
    paths:
      - tests/golden/**
      - mk/qa-golden.mk
      - .github/workflows/qa-golden.yml
      - Cargo.toml
      - Cargo.lock
  pull_request:
    paths:
      - tests/golden/**
      - mk/qa-golden.mk
      - .github/workflows/qa-golden.yml
      - Cargo.toml
      - Cargo.lock

permissions:
  contents: read

env:
  GOWORK: "off"

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.5.0
      - run: python -m pip install -r tests/golden/python/requirements.txt
      - run: make lint-qa-golden test-qa-golden
