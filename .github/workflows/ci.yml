name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r tools/contracts/requirements.txt
      - name: Validate contracts and examples
        run: python tools/contracts/validate.py
      - name: Validator, plan, and S4 translator tests
        run: python -m pytest -q tools/contracts tools/plan spikes/s4-trex-astf
      - name: Work package catalog and wiki
        run: |
          python tools/plan/plan.py check
          python tools/plan/plan.py render --check
          python tools/plan/plan.py lint

  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Unit and loopback tests (S1, S2)
        run: cargo test --workspace

  licenses:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources

  scripts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Lint shell scripts
        run: shellcheck spikes/s1-engine/run-bench.sh spikes/s3-afxdp/host/*.sh spikes/s3-afxdp/guest/*.sh tools/swarm/*.sh tools/wiki/*.sh
