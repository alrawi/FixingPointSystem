name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r tools/contracts/requirements.txt
      - name: Validate contracts and examples
        run: python tools/contracts/validate.py
      - name: Validator, plan, swarm helper, and S4 translator tests
        run: python -m pytest -q tools/contracts tools/plan tools/swarm spikes/s4-trex-astf
      - name: Work package catalog and wiki
        run: |
          python tools/plan/plan.py check
          python tools/plan/plan.py render --check
          python tools/plan/plan.py lint

  proto:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: bufbuild/buf-action@8c6a16e16f12ba20b6470afa9c2ba9b5ba8c97c3 # v1.5.0
        with:
          version: 1.74.0
          setup_only: true
      - name: Format and lint the agent proto
        run: |
          buf format --diff --exit-code contracts/proto
          buf lint contracts/proto
      - name: Breaking changes against the base branch
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if git cat-file -e "$BASE_SHA:contracts/proto/buf.yaml" 2>/dev/null; then
            buf breaking contracts/proto --against ".git#ref=$BASE_SHA,subdir=contracts/proto"
          else
            echo "the base branch has no proto module, so there is nothing to compare"
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r tools/contracts/requirements-proto.txt
      - name: Validate example plans against the JSON mapping
        run: python tools/contracts/check_plans.py
      - name: Plan checker tests
        run: python -m pytest -q tools/contracts/test_plans.py

  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Unit and loopback tests (S1, S2)
        run: cargo test --workspace

  licenses:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources

  scripts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Lint shell scripts
        run: shellcheck spikes/s1-engine/run-bench.sh spikes/s3-afxdp/host/*.sh spikes/s3-afxdp/guest/*.sh tools/swarm/*.sh tools/wiki/*.sh
